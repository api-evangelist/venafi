standards:
- id: oauth2
  conforms: true
  evidence: 'openapi/venafi-trust-protection-foundation-websdk-openapi.yml declares a complete
    OAuth 2.0 authorization server: POST /vedauth/authorize/oauth (authorization code), /device
    (RFC 8628 device grant), /jwt (RFC 7523 JWT bearer), /certificate, /integrated, /token
    (refresh) and DELETE /vedauth/revoke/token (RFC 7009). securitySchemes declares
    AccessToken as http/bearer, and every operation annotates its required scope.'
- id: oidc
  conforms: false
  evidence: No /.well-known/openid-configuration was served on any probed host (see
    well-known/venafi-well-known.yml) and no openIdConnect securityScheme appears in either
    contract. JWT mapping endpoints (/vedsdk/oauth/createjwtmapping) accept external OIDC
    issuers, but the platform does not publish OIDC discovery metadata itself.
- id: rfc9457
  conforms: false
  evidence: No application/problem+json media type appears in either contract; errors are plain
    application/json objects. See errors/venafi-problem-types.yml.
- id: pagination
  conforms: true
