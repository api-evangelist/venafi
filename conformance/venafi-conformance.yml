domain_standards:
- id: acme
  name: ACME (RFC 8555) — Automatic Certificate Management Environment
  conforms: true
  evidence: 'https://docs.venafi.cloud/vaas/configurations/acme-server-overview/ — "An ACMEv2
    server in CyberArk Certificate Manager - SaaS provides a way for ACME-compatible clients to
    request certificates by using the ACME protocol." The provider names ACME External Account
    Binding (RFC 8555 §7.3.4) as its client authentication model and names Lego and cert-manager
    as compatible clients.'
  deviations:
  - ACME challenge types HTTP-01, DNS-01 and TLS-ALPN-01 are not used; issuance authorization is
    delegated to the configured application and request policy rather than to domain-ownership
    validation.
  - The ACME renewal workflow is not used; renewal is a new order plus CSR.
  configuration: https://docs.venafi.cloud/vaas/configurations/configure-acme-server-connection/
- id: acme-client
  name: ACMEv2 as a CA connector (Let's Encrypt)
  conforms: true
  evidence: https://docs.venafi.cloud/ navigation publishes "Using ACMEv2 Let's Encrypt" under
    Issue certificates — the platform is an ACME client as well as an ACME server.
- id: x509-pkix
  name: X.509 / PKIX certificate lifecycle
  conforms: true
  evidence: 'openapi/venafi-trust-protection-foundation-websdk-openapi.yml publishes an
    X509CertificateStore API set (/vedsdk/X509CertificateStore/add, /lookup, /lookupexpiring,
    /remove, /retrieve); the SaaS contract exposes certificate contents, chains and keystore
    downloads. This is the provider''s core domain.'
- id: pkcs
  name: PKCS#8 / PKCS#12 / PKCS#11
  conforms: true
  evidence: 'The SaaS API documents private key import in both PKCS#12 and PKCS#8 form
    (https://docs.venafi.cloud/api/importing-private-key-via-api-pkcs12/,
    .../importing-private-key-via-api-pkcs8/) and keystore download; the WebSDK publishes a
    CodeSigning HSM API and the Firefly/Code Sign client documents PKCS#11 HSM integration.'
- id: ssh-certificates
  name: OpenSSH certificate and authorized_keys management
  conforms: true
  evidence: 'openapi/venafi-trust-protection-foundation-websdk-openapi.yml tags "SSH Certificate
    APIs" and "SSH Management APIs" with /vedsdk/sshcertificates/request,
    /vedsdk/ssh/AddAuthorizedKey, /ImportAuthorizedKey and self-service authorized-key
    operations.'
- id: spiffe
  name: SPIFFE / SPIRE workload identity
  conforms: true
  evidence: The Control Plane documentation publishes a "CSI driver for SPIFFE" component and a
    Workload Identity Manager surface (/v1/distributedissuers/* in the SaaS contract) for issuing
    short-lived workload identities into Kubernetes.
- id: sigstore
  name: Sigstore / cosign KMS plugin
  conforms: true
  evidence: First-party plugin github.com/Venafi/sigstore-kms-venafi (CodeSign Protect plugin for
    Sigstore cosign) and github.com/Venafi/notation-venafi-csp (Notation CLI signing plugin).
- id: cert-manager
  name: cert-manager Issuer / Kubernetes CSR
  conforms: true
  evidence: 'https://cert-manager.io/docs/configuration/venafi/ documents a first-class Venafi
    (now "CyberArk") Issuer; the Control Plane ships its own approver-policy, istio-csr, CSI
    driver, trust-manager and OpenShift-routes components documented at docs.venafi.cloud.'
