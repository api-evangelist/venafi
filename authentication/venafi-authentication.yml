  type: apiKey
  in: header
  parameter: service-account
  api: Certificate Manager - SaaS API
  description: 'Service-account credential scheme declared in the SaaS contract as an apiKey
    header named "service-account". NOTE — the provider''s own documentation states that a
    service account access token is sent in the standard `Authorization: Bearer` header, not in a
    `service-account` header; the contract and the docs disagree and this is recorded as
    published rather than reconciled. Service accounts are created via POST /v1/serviceaccounts
    and their available scopes read from GET /v1/serviceaccounts/scopes.'
