  name: Venafi Log APIs API
  description: "The Log APIs allow to manage CyberArk application event logs. The Log interface allow\
    \ for events to be recorded in the \nTrust Protection Foundation log table. Many API method calls\
    \ do not automatically generate log events. Therefore, you should consider using the Log API to track\
    \ events for auditing and troubleshooting purposes.\n\n\n\n# Log server event definitions\nThe Log\
    \ server relies on event definitions to categorize events. You can call POST Log and these types of\
    \ event definitions to log events:\n\n* **Add-on application event definitions**: An optional set\
    \ of event definitions that you define for your custom SDK applications. \nAdd-on application event\
    \ definitions use Component IDs in the 0200-0299 range. This reserved range of Component IDs ensures\
    \ that your \nevent definitions have unique Event IDs. After a successful import, the event definitions\
    \ appear in the Logging Event Definitions folder.\nFor more information about importing add-on application\
    \ event definitions, see the Log Server Administration Guide.\n* **Predefined event definitions**:\
    \ A set of Trust Protection Foundation event definitions. The event definitions appear in the Logging\
    \ Event Definitions folder.\nTo see a complete list of Trust Protection Foundation Event Group IDs\
    \ and error codes, which are in hexadecimal format, visit our Support article."
