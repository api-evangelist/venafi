- aid: venafi:venafi-certificate-management-apis-api
  name: Venafi Certificate Management APIs API
  description: "The endpoints in this section manage TLS certificates. If you want certificates to secure\
    \ SSH keys, see the _SshCertificates_ section\n## PKIX Parameter Set ##\nAs of TPP 25.1 algorithms\
    \ are identified by an OID called PKIX Parameter Set. The following table lists the OID for each algorithm:\
    \ \n\n\n\n**RSA Algorithms**\n\n| Algorithm | PKIX Parameter Set | Description |\n|-----------|--------------------|--------------------------|\n\
    | RSA 1024 | 1.3.6.1.4.1.28783.10.1.1.1024| RSA 1024 bits offers moderate security but is now considered\
    \ vulnerable and outdated for most modern applications. |\n| RSA 2048 | 1.3.6.1.4.1.28783.10.1.1.2048|\
    \ RSA 2048 bits offers strong security and is widely used for modern encryption and digital signatures.\
    \ |\n| RSA 3072 | 1.3.6.1.4.1.28783.10.1.1.3072| RSA 3072 bits provides a higher security level, suitable\
    \ for long-term protection of sensitive data. |\n| RSA 4096 | 1.3.6.1.4.1.28783.10.1.1.4096| RSA 4096\
    \ bits offers very high security, commonly used for highly sensitive data and long-term encryption.\
    \ |\n| RSA 8192 | 1.3.6.1.4.1.28783.10.1.1.8192| RSA 8192 bits provides extremely high security, used\
    \ for the most sensitive data and long-term protection. |\n| RSA PSS/OAEP 1024 | 1.3.6.1.4.1.28783.10.1.2.1024|\
    \ RSA 1024 bits PSS provides moderate security for digital signatures, with PSS offering improved\
    \ resistance against certain attacks, though it's now considered vulnerable for most applications.\
    \ |\n| RSA PSS/OAEP 2048 | 1.3.6.1.4.1.28783.10.1.2.2048| RSA 2048 bits PSS offers strong security\
    \ with enhanced resistance to forgery and adaptive chosen-message attacks, making it widely used in\
    \ modern systems. |\n| RSA PSS/OAEP 3072 | 1.3.6.1.4.1.28783.10.1.2.3072| RSA 3072 bits PSS provides\
    \ enhanced security for long-term digital signature protection, with PSS improving resistance to certain\
    \ signature-related attacks. |\n| RSA PSS/OAEP 4096 | 1.3.6.1.4.1.28783.10.1.2.4096| RSA 4096 bits\
    \ PSS provides very high security for digital signatures, with PSS offering added protection against\
    \ vulnerabilities in deterministic signature schemes. |\n| RSA PSS/OAEP 8192 | 1.3.6.1.4.1.28783.10.1.2.8192|\
    \ RSA 8192 bits PSS offers extremely high security for critical digital signatures, with PSS further\
    \ strengthening resistance to advanced cryptographic attacks and long-term protection. |\n\n**Elliptic\
    \ Curve Digital Signature Algorithms (ECDSA)**\n\n| Algorithm | PKIX Parameter Set | Description |\n\
    |-----------|--------------------|--------------------------|\n| ECDSA P-256 | 1.3.6.1.4.1.28783.10.2.1.256|\
    \ Digital signature algorithm based on the NIST P-256 curve, providing 128-bit security. |\n| ECDSA\
    \ P-384 | 1.3.6.1.4.1.28783.10.2.1.384| Digital signature algorithm based on the NIST P-384 curve,\
    \ providing 192-bit security. |\n| ECDSA P-521 | 1.3.6.1.4.1.28783.10.2.1.521| Digital signature algorithm\
    \ based on the NIST P-521 curve, providing 256-bit security. |\n| Brainpool P-256r1 | 1.3.6.1.4.1.28783.10.2.2.1|\
    \ Brainpool P256 is a 256-bit elliptic curve offering strong security for digital signatures and key\
    \ exchange. |\n| Brainpool P-384r1 | 1.3.6.1.4.1.28783.10.2.2.2| Brainpool P384 is a 384-bit elliptic\
    \ curve providing enhanced security for high-assurance applications. |\n| Brainpool P-512r1 | 1.3.6.1.4.1.28783.10.2.2.3|\
    \ Brainpool P512 is a 512-bit elliptic curve offering very high security for sensitive data and long-term\
    \ protection. |\n| Brainpool P-160r1 | 1.3.6.1.4.1.28783.10.2.2.4| Brainpool P160 is a 160-bit curve,\
    \ offering moderate security for lightweight cryptographic applications. |\n| Brainpool P-160t1 |\
    \ 1.3.6.1.4.1.28783.10.2.2.5| Brainpool P160T is a 160-bit twisted curve, offering efficient performance\
    \ and moderate security for lightweight applications. |\n| Brainpool P-192r1 | 1.3.6.1.4.1.28783.10.2.2.6|\
    \ Brainpool P192 is a 192-bit curve providing a balanced security level for general-purpose cryptography.\
    \ |\n| Brainpool P-192t1 | 1.3.6.1.4.1.28783.10.2.2.7| Brainpool P192T is a 192-bit twisted curve,\
    \ optimized for faster cryptographic operations with improved security. |\n| Brainpool P-224r1 | 1.3.6.1.4.1.28783.10.2.2.8|\
    \ Brainpool P224 is a 224-bit curve offering strong security for medium-strength cryptographic applications.\
