- aid: venafi:venafi-metadata-apis-api
  name: Venafi Metadata APIs API
  description: >-
    The Metadata interface manages Custom Fields for objects that appear in the following places of the
    UI:


    * Certificates

    * Devices

    * Code Signing Projects

    * Code Signing Environments





    # Metadata Types


    |Type|Name|Description|

    |----|----|-----------|

    |1|Text|Can accept a single line of text. `MinimumLength`, `MaximumLength`, `Mask` and `RegularExpression`
    apply to this field type|

    |2|List|Provides the user with a list of selectable items. `Single` controls if one or more items
    can be selected|

    |3|Choice|Provides the user with options. if `Single` is **true**, the options are presented as radio-buttons,
    otherwise they are checkboxes|

    |4|Date|Provides the user with a date/time selector. `DateOnly` and `TimeOnly` apply to this field
    type|

    |5|Identity|Provides the user with the ability to select an identity. If `Single` is **true**, only
    one identity can be selected|




    # Metadata Item (Custom Field Definition)

    The Metadata Item describes a Custom Field.


    |Property name|Data Type|Description|

    |-------------|---------|-----------|

    |AllowedCharacters|string|_Optional_: All characters allowed in values|

    |AllowedValues|[string]|_Optional_: An array of allowable values|

    |Classes|[string]|An array of schema classes that can use the custom field|

    |SchemaAttribute|string|_Read-Only_: The Custom Field GUID|

    |DateOnly|boolean|_For Date type Custom Fields_: Only ask for date, hide time|

    |DN|string|_Read-Only_: The DN of the Custom Field definition object|

    |DefaultValues|[string]|_Optional_: An array of values used set by default on the CustomField|

    |Guid|string|_Read-Only_: The Custom Field GUID|

    |Help|string|_Optional_: The tool tip to show the user how to populate the Custom Field|

    |Label|string|The text that describes the Custom Field in the UI|

    |Mandatory|boolean|_Optional_: If **true**, users must enter a value for the Custom Field in the UI|

    |Mask|string|_Optional_: An input mask to use for Text type Custom Fields. The '#'-character represents
    characters the user may provide|

    |MaximumLength|nullable integer|_Optional_: The maximum number of characters a user can input for
    the Custom Field that accepts a string|

    |MinimumLength|nullable integer|_Optional_: The minimum number of characters a user must input for
    the Custom field that accepts a string|

    |Name|string|The name (CN) of the Custom Field. Required for `POST metadata/defineitem`, read-only
    otherwise|

    |Policyable|boolean|_Optional_: If **true**, policy will be applied to a Custom Field|

    |RegularExpression|string|_Optional_: The regular expression to apply to user input in a Text type
    Custom Field|

    |RenderHidden|boolean|_Optional_: If **true**, the UI will not display the Custom Field|

    |RenderReadOnly|boolean|_Optional_: If **true**, the UI will display the Custom Field but not let
    the user change it|

    |Single|boolean|_Optional_: If **true**, only a single value can be selected for a List or Choice
    type Custom Field|

    |TimeOnly|boolean|_Optional_: If **true**, only a time can be entered in a Date type Custom Field|

    |Type|integer|The type of the Custom Field. Required for `Post metadata/defineitem`, read-only otherwise|
