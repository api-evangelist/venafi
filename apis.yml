- aid: venafi:venafi-client-management-apis-api
  name: Venafi Client Management APIs API
  description: >-
    ## OSName Definitions ##


    * AIX

    * Android

    * BlackBerry

    * BSD

    * HPux

    * iOS

    * Linux

    * MacOS

    * Other

    * Solaris

    * Unknown

    * Windows

    * zOS



    ## ClientType Definitions ##


    |ClientType|Description|

    |---|---|

    |VenafiAgent|Return information about server agent clients|

    |AgentJuniorMachine|Return information about Windows user agent clients running as system|

    |AgentJuniorUser|Return information about Windows user agent clients running as user|

    |Portal|Return information about end user portal clients|

    |Agentless|Return information about agentless clients|

    |PreEnrollment|Return information about Pre-enrollment user clients|

    |iOS|Return information about IOS clients|

    |Android|Return information about Android clients|



    ## WorkType definitions ##


    |WorkType|Description|

    |---|---|

    |Client Agent Configuration Work|The frequency that agents can check in with the Trust Protection
    Foundation server to retrieve work assignments and schedules|

    |Client Agent Automatic Upgrade Work|The manner that agents upgrade devices|

    |Client Agent Device Placement Work|The manner that agents manage traffic isolation, scalability,
    manageability, and serviceability|

    |Certificate Provisioning Work|The manner that agents install certificates on devices|

    |Client Agent SSH Discovery Work|The manner that agents discover certificates on devices|

    |Client Agent SSH Provisioning Work|The manner that agents install certificates and keys on UNIX or
    Linux devices|

    |Client Agent SSH Key Usage Work|The manner that agents monitor SSH Key usage|

    |Client User Certificate Work|The manner that agents enroll certificates on behalf of devices|

    |Client Certificate Work|The manner that agents install certificates for browsers|
