- aid: venafi:trust-protection-foundation-websdk
  name: Trust Protection Foundation WebSDK (Venafi Trust Protection Platform)
  description: The self-hosted Venafi / CyberArk Trust Protection Foundation Web SDK, version 26.1.1.
    388 operations across 364 paths covering certificate management, discovery, identity and permissions,
    OAuth application/scope administration (/vedauth, /vedsdk/oauth), SSH certificates and authorized
    keys, code signing and HSM, SecretStore, flows, recycle bin, processing engines, statistics and system
    status. Because the product is customer-installed, the contract publishes a templated server (https://{dnsname}/)
    rather than a vendor host.
  humanURL: https://docs.venafi.com/Docs/currentAPI/
  baseURL: https://{dnsname}/
