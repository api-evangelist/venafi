- aid: venafi:venafi-system-status-apis-api
  name: Venafi System Status APIs API
  description: "The SystemStatus interface provides status and upgrade information about Trust Protection\
    \ Foundation engines. This information also appears in the UI.\n# Engine Upgrade Status\nEngineUpgradeState\
    \ describes the following Trust Protection Foundation upgrade statuses:\n\n* _Upgrade Complete_: The\
    \ upgrade completed on all Trust Protection Foundation engines.\n* _Upgrade Blocked_: One or more\
    \ dependency tasks prevented the upgrade from completing.\n* _Upgrade In Error_: The upgrade encountered\
    \ an error.\n* _Upgrade Running_: The upgrade is to a newer version is in progress.\n* _Upgrade Pending\
    \ Install_: The numbers of engines that still have a previous version of Trust Protection Foundation.\
    \ An upgrade is required.\n\n\n# Service Status\nThe Service status describes engine availability:\
    \ \n\n* _Down_: The service is deemed unavailable for operations. The service is considered down if\
    \ the TimeSinceLastSeen is greater than six minutes. When Demo mode is enabled to allow updates every\
    \ 30 seconds, the service is considered down if TimeSinceLastSeen is greater than 45 seconds.\n* _New_:\
    \ The vPlatform service never detected operations for this service. The corresponding timeSinceFirstSeen\
    \ and TimeSinceLastSeen values are also empty.\n* _Unknown_: The IIS status is unknown because the\
    \ vPlatform service is not currently available to report the status.\n* _Up_: The service is deemed\
    \ available for operations. The service is considered up if the TimeSinceLastSeen is less than six\
    \ minutes. When Demo mode is enabled to allow updates every 30 seconds, the service is considered\
    \ up if TimeSinceLastSeen is less than 45 seconds.\n\n\n# Upgrade Status Summary Details object\n\
    The UpgradeSummary object describes the status of a Trust Protection Foundation upgrade:\n\n\n* _Status_:\
    \ The Engine Upgrade Status.\n* _StatusDetails_: Appears only when an upgrade is blocked, in error,\
    \ or pending installation. Additional information about the upgrade.\n* _UpgradeStartTime_: The UTC\
    \ start time that the upgrade began on the first engine.\n* _UpgradeStopTime_: The UTC completion\
    \ time when the last engine finished the upgrade.\n* _CompletedTasks_: The total number of upgrade\
    \ task across all engines.\n* _OriginVersion_: Appears on any upgrades that occur after 20.1. For\
    \ example, if you are upgrading to 20.1 or higher for the first time, the value is omitted. The starting\
    \ point version prior to Trust Protection Foundation upgrades.\n* _TargetVersion_: The intended Trust\
    \ Protection Foundation version.\n* _RemainingTasks_: Appears only when additional upgrade tasks are\
    \ present.\n* _EnginesComplete_: The number of engines that successfully completed the upgrade.\n\
    * _EnginesRunning_: The number of engines that are currently upgrading.\n* _EnginesBlocked_: The number\
    \ of engines blocked by other upgrade tasks or dependencies.\n* _EnginesInError_: The number of engines\
    \ that are in a failed state. These engines retry every three minutes.\n* _EnginesPendingInstall_:\
    \ The number of engines that still have a previous version of Trust Protection Foundation installed.\
    \ An upgrade is required."
  humanURL: https://developer.venafi.com/tlsprotectcloud/reference/tls-protect-overview
  baseURL: https://api.venafi.cloud
