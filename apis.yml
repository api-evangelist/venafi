- aid: venafi:venafi-identity-apis-api
  name: Venafi Identity APIs API
  description: >-
    The Identity interface manages users and group access. The Web SDK supports the following identity
    providers for viewing individuals and groups of users:


    |Provider|Requirements|

    |---|---|

    |AD|Read only. Allows view capability from an external Microsoft Active Directory (AD). Requires an
    Active Directory connection before making API calls. For more information, see the Administration
    Guide.|

    |LDAP|Read only. Allows view capability from an external Lightweight Directory Access Protocol (LDAP)
    data source. Requires setup before making API calls. Use the LDAP Identity Provider Wizard. For more
    information, see the Administration Guide.|

    |Local|Default. Allows view capability and password rotation only in Trust Protection Foundation.|


    **What is the difference between Credentials, Permissions, and Identity?**

    * Credentials endpoints manage certificate and other activities. For more information, see Credentials
    APIs.

    * Identity endpoints manage CyberArk users. For more information, see Identity APIs.

    * Permissions endpoints grant principals (users and groups) privileges to objects within Trust Protection
    Foundation. For more information, see Permission API.
