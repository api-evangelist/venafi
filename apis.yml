apis:
- aid: venafi:certificate-manager-saas
  name: Certificate Manager - SaaS API (Venafi Control Plane)
  description: The Venafi / CyberArk Certificate Manager - SaaS REST API. 184 operations across 120 paths
    covering certificate inventory and search, certificate requests and issuing templates, applications,
    machines and machine identities, credential managers, teams and users, service accounts and scopes,
    tags, event logs, VSatellites (edge instances/workers), webhook connectors, expiration/auto-renewal
    monitoring, approval rules, plugins and Workload Identity Manager (distributed issuers). Served from
    six regional hosts under venafi.cloud.
  humanURL: https://developer.venafi.com/tlsprotectcloud/reference/tls-protect-overview
  baseURL: https://api.venafi.cloud
  tags:
