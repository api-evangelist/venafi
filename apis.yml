- aid: venafi:venafi-hashicorp-pki-apis-api
  name: Venafi HashiCorp PKI APIs API
  description: "The Public Key Infrastructure (PKI) interface allows Trust Protection Foundation to act\
    \ as an Intermediate Certificate \nAuthority for certificate vaults. This interface also sends the\
    \ CSR to the CA to sign.\n\n\n\nThe signed certificate includes the root, intermediate, and end user\
    \ certificate chain. Trust Protection Foundation provisions \nthe chain to the vault and stores information\
    \ about the chain. The vault stores the intermediate and end user certificates.\n\n\n\nThe PKI interface\
    \ is only available through the Web SDK.However, the HashiCorpVault PKI application object and Role\
    \ object appear \nin the Policy folder. For other details, see HashiCorp Vault PKI—overview.\n\n\n\
    \nThis interface is valid only if you purchased a certificate product."
