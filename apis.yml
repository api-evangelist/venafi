aid: venafi
name: Venafi
description: 'Venafi is the machine identity security platform for discovering, issuing, provisioning
  and retiring TLS/SSL certificates, SSH keys, code-signing keys and workload identities across data centers,
  clouds and Kubernetes. Its Control Plane ships two public REST contracts: the SaaS "Certificate Manager
  - SaaS" API on api.venafi.cloud (six data-residency regions) and the self-hosted Trust Protection Foundation
  WebSDK. Venafi was acquired by CyberArk in 2024 and the products now carry CyberArk Certificate Manager
  branding; venafi.com itself 301s to Palo Alto Networks following its acquisition of CyberArk, while
  developer.venafi.com, docs.venafi.com, docs.venafi.cloud, api.venafi.cloud and github.com/Venafi remain
  live and are where every artifact in this profile came from.'
