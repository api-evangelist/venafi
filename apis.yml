  name: Venafi Legacy Workflow APIs API
  description: >-
    The Workflow/Ticket interface manages certificates in an automated workflow. Trust Protection Foundation
    engines rely upon workflow object settings and their assignment to folders for the creation of workflow
    tickets and their impact on the objects to which they apply.




    The methods provided in this section allow for workflow tickets to be generated, updated, and removed
    independent of Trust Protection Foundation processing, making them applicable to external use cases
    that involve Trust Protection Foundation objects. A workflow can now apply to certificate renewal
    and provisioning to Windows or SSH devices.
