- aid: venafi:venafi-permission-apis-api
  name: Venafi Permission APIs API
  description: "The Permissions interface enables the management and querying of permissions within CyberArk\
    \ Trust Protection Foundation™. \nPermissions grant principals (users and groups) privileges to objects\
    \ within Trust Protection Foundation.\nIn the Permissions interface, when a HTTP GET retrieves the\
    \ permissions for a specific principal, both the effective \nand Implicit Permissions are returned.POST,\
    \ PUT, or DELETE operations in this interface can successfully apply \nEffective Permissions parameters\
    \ to principals in different identity providers.\n**What is the difference between Credentials, Permissions,\
    \ and Identity?**\n* Credentials endpoints manage certificate and other activities. For more information,\
    \ see Credentials APIs.\n* Identity endpoints manage CyberArk users. For more information, see Identity\
    \ APIs.\n* Permissions endpoints grant principals (users and groups) privileges to objects within\
    \ Trust Protection Foundation."
