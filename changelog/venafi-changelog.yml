note: 'Two dated feeds, both public and both current as of 2026-09-02. "What''s New: Product
  Capabilities" carries user-facing platform capability announcements; "What''s New: Enhancements
  and Software Version Updates" carries component release notes (cert-manager, istio-csr, CSI
  drivers, Enterprise Issuer, Approver Policy, Trust Manager). Neither feed is an API changelog
  per se — the provider does not publish a versioned changelog for the REST contracts themselves,
  and no Sunset or Deprecation headers appear in either OpenAPI. Entries are recorded verbatim as
  the docs title them; only the recent window is captured.'
