note: 'Two different authorization models. (1) The self-hosted Trust Protection Foundation WebSDK
  is a full OAuth 2.0 authorization server (POST /vedauth/authorize/oauth, /device, /jwt,
  /certificate, /integrated, /token, and DELETE /vedauth/revoke/token) and every operation in the
  published contract annotates its required scope in the operation description. Scopes take the
  form <scope>:<privilege> where privilege is one of manage, delete, discover, revoke, approve,
  read; a bare scope name grants read. The provider docs describe a client declaring, e.g.,
  "scope: certificate:discover,delete,manage,revoke". (2) The SaaS Control Plane does NOT use
  OAuth scopes in its OpenAPI securitySchemes — it authenticates with the tppl-api-key header or
  a service-account bearer token, and the scope a service account may hold is enumerated at
  runtime from GET /v1/serviceaccounts/scopes. Counts below are the number of operations in the
  WebSDK contract that declare each scope.'
oauth:
  authorization_server: self-hosted Trust Protection Foundation (/vedauth)
  flows:
  - authorization_code (POST /vedauth/authorize/oauth)
  - device_code (POST /vedauth/authorize/device)
  - jwt_bearer (POST /vedauth/authorize/jwt)
  - client_certificate (POST /vedauth/authorize/certificate)
  - integrated_windows_auth (POST /vedauth/authorize/integrated)
  - refresh_token (POST /vedauth/authorize/token)
  revocation: DELETE /vedauth/revoke/token
  introspection: GET /vedauth/authorize/verify
