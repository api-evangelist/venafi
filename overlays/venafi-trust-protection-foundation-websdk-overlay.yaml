overlay: 1.0.0
info:
  title: API Evangelist enhancements — Venafi Trust Protection Foundation WebSDK
  version: 1.0.0
extends: openapi/venafi-trust-protection-foundation-websdk-openapi.yml
x-generated: '2026-09-02'
