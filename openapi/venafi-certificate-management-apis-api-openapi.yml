    Nullable_1_Core_Cryptography_SubjectAltNameType_:
      title: Enumeration of possible SAN types
      enum:
      - 2
      - 1
      - 1
      - 7
      - 6
      - 0
      type:
      - integer
      - 'null'
      description: "\n\n**2**: **DNS**  \nSpecifies the SubjestAltName is a DNS entry\n\n**1**: **RFC822**  \nSpecifies the SubjestAltName is an Email address\n\n**1**: **Email**  \nSpecifies the SubjestAltName is an Email address\n\n**7**: **IPAddress**  \nSpecifies the SubjestAltName is an IP Address\n\n**6**: **URI**  \nSpecifies the SubjestAltName is a Uniform Resource Identifier\n\n**0**: **OtherName**  \nSpecifies the Subject AltName is an Other Name.\n"
      format: int32
