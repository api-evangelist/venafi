openapi: 3.2.0
info:
  title: Trust Protection Foundation WebSDK Certificate Management…
  description: '# Introduction

    The Trust Protection Foundation Web SDK is a subset of REST APIs that allow you to:

    * Automate certificate management

    * Integrate with DevOps processes

    * Discover machine identities

    * Extract data to integrate with data warehouses

    * Perform bulk actions

    * Set up and administer Trust Protection Foundation

    * Onboard teams

    * Create custom, automated business logic and flows between internal systems


    All these use cases can be accomplished using the Trust Protection Foundation REST…'
  version: 26.1.1
servers:
- url: /
  description: Current Host
- url: https://REPLACEdnsnameME/
  description: System
- url: https://{dnsname}/
  description: Configurable Hostname
  variables:
    dnsname:
      default: localhost
      description: Production API Hostname
security:
- AccessToken: []
tags:
- name: Certificate Management APIs
  description: The endpoints in this section manage TLS certificates.
paths:
  /vedsdk/certificates/Retrieve/{vaultId}:
    parameters:
    - name: vaultId
      in: path
      description: The certificate data Vault Id.
      required: true
      schema:
        type: string
    post:
      tags:
      - Certificate Management APIs
      summary: Retrieve a certificate by vault ID
      description: 'Returns the available certificate data and optional private key information for an enrolled or archived certificate by its Vault Id.

        The format property of the request allows to choose the following formats of the returned certificate binary data:

        * Base64

        * Base64 (PKCS #8)

        * DER

        * JKS:

        * PKCS #7

        * PKCS #12


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificateRetrieveByVaultId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_RetrieveByVaultIdRequest_Retrieve__vaultId_'
        required: true
      responses:
        '200':
          description: Certificate retrieved successfully. The response body contains the certificate data and optional private key information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RetrieveResponse_Retrieve__vaultId_'
        '400':
          description: Invalid or missing request parameters. The Error property contains details about the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RetrieveResponse'
      security:
      - AccessToken: []
    get:
      tags:
      - Certificate Management APIs
      summary: Retrieve a certificate by vault ID (GET)
      description: 'Returns the available certificate data and optional private key information for an enrolled or archived certificate by its Vault Id.

        The format property of the request allows to choose the following formats for the returned data:


        | Format | Response Content Type |

        | ---------------- | -------------------------------- |

        | Base64 | application/x-pem-file |

        | Base64 (PKCS #8) | application/x-pem-file |

        | DER | application/x-x509-ca-cert |

        | JKS | application/octet-stream |

        | PKCS #7 | application/x-pkcs7-certificates |

        | PKCS #12 | application/x-pkcs12 |


        _Required scope: certificate_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificateRetrieveByVaultIdGet
      parameters:
      - name: Format
        in: query
        schema:
          type: string
      - name: Password
        in: query
        schema:
          type: string
      - name: IncludePrivateKey
        in: query
        schema:
          type: string
      - name: IncludeChain
        in: query
        schema:
          type: string
      - name: RootFirstOrder
        in: query
        schema:
          type: string
      - name: FriendlyName
        in: query
        schema:
          type: string
      - name: KeystorePassword
        in: query
        schema:
          type: string
      - name: EncryptionAlgorithm
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Returns the certificate as a binary stream.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/IO_Stream'
        '202':
          description: The certificate issuance is still pending. Use the /certificate/retrieve endpoint to obtain the certificate after it is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IO_Stream'
        '500':
          description: An internal error occurred during certificate retrieval processing. See the error message for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IO_Stream'
        '400':
          description: ' Invalid or missing request parameters. See the error message for details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IO_Stream'
      security:
      - AccessToken: []
  /vedsdk/certificates/{guid}/PreviousVersions:
    parameters:
    - name: guid
      in: path
      description: The certificate GUID
      required: true
      schema:
        type: string
    get:
      tags:
      - Certificate Management APIs
      summary: Get archived certificates
      description: 'Retrieves the archived versions of a certificate identified by its GUID.

        The request can include query parameters to exclude expired or revoked certificates from the results.

        The response contains a list of previous certificate versions, each with detailed information about the certificate.


        _Required scope: certificate_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificatePreviousVersions
      parameters:
      - name: ExcludeExpired
        in: query
        description: Exclude expired certificates
        required: true
        schema:
          type: string
      - name: ExcludeRevoked
        in: query
        description: Exclude revoked certificates
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Previous certificate versions retrieved successfully. The response body contains the list of previous certificate versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_PreviousVersionsResponse'
        '400':
          description: Invalid or missing request parameters. The Error property contains details about the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_PreviousVersionsResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/Validate:
    post:
      tags:
      - Certificate Management APIs
      summary: Validate a deployed certificate
      description: 'Initiates SSL/TLS network validation for one or more certificates and any associated applications.


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificateValidate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_ValidateRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_ValidateResponse'
        '400':
          description: Validation failed due to invalid or missing request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_ValidateResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/{guid}:
    parameters:
    - name: guid
      in: path
      description: The certificate GUID
      required: true
      schema:
        type: string
    put:
      tags:
      - Certificate Management APIs
      summary: Set or update certificate attributes
      description: 'Sets or updates the attributes of a certificate identified by its GUID.

        The request must include the certificate GUID in the path and the attribute data in the body.

        The response indicates whether the operation was successful and includes any warnings or errors encountered during the process.


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificatePut
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_PutRequest__guid_'
        required: true
      responses:
        '200':
          description: 'Certificate attributes set or updated successfully. '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_PutResponse'
        '400':
          description: ' Invalid or missing request parameters. The Error property contains details about the failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_PutResponse'
      security:
      - AccessToken: []
    get:
      tags:
      - Certificate Management APIs
      summary: Get certificate details
      description: 'Retrieves details and validation information about the certificate.


        _Required scope: certificate_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_GetCertificateDetails
      responses:
        '200':
          description: Retrieve Certificate Details Complete. The response body contains the detailed information about the certificate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_DetailedCertificateResult'
        '500':
          description: An unexpected error occurred during the certificate details retrieval process. The Error property contains details about the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_DetailedCertificateResult'
        '400':
          description: The request was invalid due to incorrect parameters (e.g., invalid GUID). The Error property contains details about the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_DetailedCertificateResult'
      security:
      - AccessToken: []
    delete:
      tags:
      - Certificate Management APIs
      summary: Delete a certificate
      description: 'Deletes a certificate object, all the associated objects including pending workflow tickets, and the corresponding vault information.


        _Required scope: certificate:delete_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificateDelete
      responses:
        '200':
          description: The response body contains the result of the delete operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_DeleteResponse'
        '400':
          description: The request was invalid due to incorrect parameters (e.g., invalid GUID, insufficient permissions). The Error property contains details about the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_DeleteResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/CheckPolicy:
    post:
      tags:
      - Certificate Management APIs
      summary: Check policy compliance
      description: 'Performs a policy compliance assessment of a Certificate Signing Request (CSR) against a policy Distinguished Name (DN)


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CheckPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_CheckPolicyRequest'
        required: true
      responses:
        '200':
          description: Policy compliance check completed successfully. The response includes the policy and Certificate Signing Request (CSR) data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_CheckPolicyResponse'
        '400':
          description: Invalid or missing request parameters. The Error property will provide details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_CheckPolicyResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/Request:
    post:
      tags:
      - Certificate Management APIs
      summary: Enroll or provision a certificate
      description: 'Enrolls or provisions a new certificate.


        If the certificate already exists, the current certificate archives to the History tab and the CA receives a new certificate request.


        Based on Policy tree settings, you can use a single Certificates/Request call to enroll or provision.

        The same request can also:


        * Create one or more devices that will use the same certificate.

        * Allow one or more applications that run on a device to use the same certificate.

        * Create a certificate for an elastic instance. After the instance terminates, a tool, such as an Instance

        Watcher, can automatically clean up the certificate(and associated objects).

        * Set Custom Field values on a Certificate object. After a successful enrollment or provision,

        the certificate appears in the Policy folder.However, if the

        issuing CA overrode values in the CSR, for example Organization Unit(OU), some fields may be empty.


        **NOTE:** Unless the _WorkToDoTimeout_ parameter is specified, this method will immediately return. If you want to wait for the certificate to be issued and returned in the response, specify how long you are willing to wait via _WorkToDoTimeout_.


        **Result code:**


        * 200 will be returned if the certificate request was accepted and the WorkToDoTimeout was not set.

        * 200 will be returned if the WorkToDoTimeout was set and the certificate is included in the response.

        * 202 will be returned if the certificate issuance is still pending. In this case, use the `/certificate/retrieve` endpoint to obtain the certificate after it is issued.


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificateRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_RequestRequest'
        required: true
      responses:
        '200':
          description: The certificate request was accepted and the WorkToDoTimeout was not set, OR WorkToDoTimeout was set and the certificate is included in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RequestResponse_Request'
        '202':
          description: The certificate issuance is still pending. In this case, use the `/certificate/retrieve` endpoint to obtain the certificate after it is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RequestResponse'
        '500':
          description: Internal error occurred during certificate request processing. See error message for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RequestResponse'
        '400':
          description: Invalid or missing request parameters. See error message for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RequestResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/Retrieve:
    post:
      tags:
      - Certificate Management APIs
      summary: Retrieve an issued certificate
      description: 'Returns the available certificate data and optional private key information for an enrolled

        certificate.


        Available options for `Format`:


        |Format | Content-Type |Description|

        |----------------|----------------------------------|----------------------------------|

        |Base64 | application/x-pem-file |Return the certificate in the traditional PEM format.|

        |Base64 (PKCS #8)| application/x-pem-file |Return the certificate in the PEM format and include the PKCS#8 encoded private key.|

        |DER | application/x-x509-ca-cert |Return the raw certificate. Use `IncludePrivateKey` and set the password.|

        |JKS | application/octet-stream |Return the certificate in the Java Keystore (JKS) format.|

        |PKCS #7 | application/x-pkcs7-certificates |Return the certificate with optional chain in the PKCS#7 format|

        |PKCS #12 | application/x-pkcs12 |Return the certificate in the PKCS#12 format. Use `IncludePrivateKey` and set the password."


        **Note:** This endpoint returns a JSON structure with the certificate data and other information. To download the raw certificate (in various formats), use the `GET /certificates/retrieve` endpoint.


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificateRetrieve
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_RetrieveRequest_Retrieve'
        required: true
      responses:
        '200':
          description: The certificate retrieval was successful, and the certificate data is included in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RetrieveResponse'
        '202':
          description: The certificate issuance is still pending. Use the /certificate/retrieve endpoint to obtain the certificate after it is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RetrieveResponse'
        '500':
          description: An internal error occurred during certificate retrieval processing. See the error message for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RetrieveResponse'
        '400':
          description: ' Invalid or missing request parameters. See the error message for details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RetrieveResponse'
      security:
      - AccessToken: []
    get:
      tags:
      - Certificate Management APIs
      summary: Retrieve an issued certificate (GET)
      description: 'Returns the available certificate data and optional private key information for an enrolled certificate.


        The response body contains the requested certificate in binary form.


        Depending on the requested format, the Content-Type will be:


        | Format | Content-Type |

        |------------------|----------------------------------|

        | BASE64 (pkcs #8) | application/x-pem-file |

        | BASE64 | application/x-pem-file |

        | DER | application/x-x509-ca-cert |

        | PKCS #7 | application/x-pkcs7-certificates |

        | PKCS #12 | application/x-pkcs12 |

        | JKS | application/octet-stream |


        **Note:** This API method matches `POST certificates/Retrieve`, except that all arguments are passed as part of the URL.


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificateRetrieveGet
      parameters:
      - name: CertificateDN
        in: query
        description: The Distinguished Name (DN) of the certificate to be retrieved.
        required: true
        schema:
          type: string
      - name: Format
        in: query
        description: The format in which to retrieve the certificate (e.g., Base64, DER).
        required: true
        schema:
          type: string
      - name: Password
        in: query
        description: The password to use if the certificate includes a private key. (Required if IncludePrivateKey is true)
        required: true
        schema:
          type: string
      - name: KeystorePassword
        in: query
        description: The password for the Java Keystore (JKS) format. (Required if Format is JKS)
        required: true
        schema:
          type: string
      - name: FriendlyName
        in: query
        description: The friendly name for the certificate. (Required if Format is JKS)
        required: true
        schema:
          type: string
      - name: IncludePrivateKey
        in: query
        description: Indicates whether to include the private key in the response.
        required: true
        schema:
          type: string
      - name: IncludeChain
        in: query
        description: Indicates whether to include the certificate chain in the response.
        required: true
        schema:
          type: string
      - name: RootFirstOrder
        in: query
        description: Indicates whether to include the root certificate first in the chain.
        required: true
        schema:
          type: string
      - name: EncryptionAlgorithm
        in: query
        description: The encryption algorithm to use for the certificate.
        required: true
        schema:
          type: string
      - name: WorkToDoTimeout
        in: query
        description: The time to wait for the certificate to be issued before returning a response.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the certificate as a binary stream.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/IO_Stream'
        '202':
          description: The certificate issuance is still pending. Use the /certificate/retrieve endpoint to obtain the certificate after it is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IO_Stream'
        '500':
          description: An internal error occurred during certificate retrieval processing. See the error message for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IO_Stream'
        '400':
          description: ' Invalid or missing request parameters. See the error message for details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IO_Stream'
      security:
      - AccessToken: []
  /vedsdk/certificates/Renew:
    post:
      tags:
      - Certificate Management APIs
      summary: Renew a certificate
      description: 'Requests immediate renewal for an existing certificate. A renewable certificate cannot be currently processing, in error,

        or contain a ''Monitoring'' Management Type.


        Optionally, this API call can renew a previously disabled certificate.


        _The caller must have Write permission to the Certificate object that requires renewal._


        **NOTE:** Unless the _WorkToDoTimeout_ parameter is specified, this method will immediately return. If you want to wait for the certificate to be issued and returned in the response, specify how long you are willing to wait via _WorkToDoTimeout_.


        **Result code:**


        * 200 will be returned if the certificate request was accepted and the WorkToDoTimeout was not set.

        * 200 will be returned if the WorkToDoTimeout was set and the certificate is included in the response.

        * 202 will be returned if the certificate issuance is still pending. In this case, use the `/certificate/retrieve` endpoint to obtain the certificate after it is issued.


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificateRenew
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_RenewRequest'
        required: true
      responses:
        '200':
          description: The response body contains the renewed certificate data and other information. Returned if the certificate request was accepted and the WorkToDoTimeout was not set, OR WorkToDoTimeout was set and the certificate is included in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RenewResponse_Renew'
        '202':
          description: Returned if the certificate issuance is still pending. In this case, use the `/certificate/retrieve` endpoint to obtain the certificate after it is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RenewResponse'
        '500':
          description: An internal error occurred during certificate renewal processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RenewResponse'
        '400':
          description: The request was invalid due to missing or incorrect parameters (e.g., certificate not found, no PKCS#10 provided for a User Provided CSR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RenewResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/Revoke:
    post:
      tags:
      - Certificate Management APIs
      summary: Revoke a certificate
      description: 'Revokes an existing certificate. The request can be made using either the certificate''s Distinguished Name (DN) or its Thumbprint.

        If both are provided, the DN will be used. The revocation reason and comments are optional.

        If the Disable parameter is set to true, the certificate will be disabled after revocation.

        The WorkToDoTimeout parameter specifies the time to wait for the revocation process to complete before returning a response.


        _Required scope: certificate:revoke_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificateRevoke
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_RevokeRequest'
        required: true
      responses:
        '200':
          description: The certificate was successfully revoked. The Success property is true, and Revoked is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RevokeResponse'
        '202':
          description: The revocation request has been submitted but is pending confirmation. The Success property is true, but Revoked remains false. A warning message may indicate the pending status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RevokeResponse'
        '500':
          description: An unexpected error occurred during revocation processing. The Error property contains details about the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RevokeResponse'
        '400':
          description: The request was invalid due to missing or incorrect parameters (e.g., certificate not found, no revocation reason provided). The Error property contains details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RevokeResponse'
        '403':
          description: The request was denied due to insufficient permissions to revoke the certificate. The Error property contains details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RevokeResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/:
    get:
      tags:
      - Certificate Management APIs
      summary: Search certificates
      description: 'Returns certificate details and the total number of certificates that match the specified search filters.


        _Required scope: certificate_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_GetCertificates
      parameters:
      - name: offset
        in: query
        description: Number of certificates to skip from the beginning.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of certificates to take.
        schema:
          type: string
      - name: optionalfields
        in: query
        description: Comma separated list of optional fields.
        schema:
          type: string
      - name: createdon
        in: query
        description: Certificates created on the date and time.
        schema:
          type: string
      - name: createdongreater
        in: query
        description: Certificates created after the date and time.
        schema:
          type: string
      - name: createdonless
        in: query
        description: Certificates created before the date and time.
        schema:
          type: string
      - name: parentdn
        in: query
        description: Certificates in specific policies DN.
        schema:
          type: string
      - name: parentdnrecursive
        in: query
        description: Certificates below specific policies DN.
        schema:
          type: string
      - name: keysize
        in: query
        description: Certificates with the key size from the list.  See also ParameterSet
        schema:
          type: string
      - name: keysizegreater
        in: query
        description: Certificates with the key size greater than the value.
        schema:
          type: string
      - name: keysizeless
        in: query
        description: Certificates with the key size less than the value.
        schema:
          type: string
      - name: stage
        in: query
        description: Certificates in any stage from the list.
        schema:
          type: string
      - name: stagegreater
        in: query
        description: Certificates in stage greater than the value.
        schema:
          type: string
      - name: stageless
        in: query
        description: Certificates in stage less than the value.
        schema:
          type: string
      - name: validto
        in: query
        description: Certificates with valid to as the date and time.
        schema:
          type: string
      - name: validtogreater
        in: query
        description: Certificates with valid to greater the date and time.
        schema:
          type: string
      - name: validtoless
        in: query
        description: Certificates with valid to less the date and time.
        schema:
          type: string
      - name: validfrom
        in: query
        description: Certificates with valid from as the date and time.
        schema:
          type: string
      - name: validfromgreater
        in: query
        description: Certificates with valid from greater the date and time.
        schema:
          type: string
      - name: validfromless
        in: query
        description: Certificates with valid from less the date and time.
        schema:
          type: string
      - name: pendingworkflow
        in: query
