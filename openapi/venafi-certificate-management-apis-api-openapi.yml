          type: boolean
          description: Indicates whether to include the certificate chain in the response.
        RootFirstOrder:
          type: boolean
          description: Indicates whether to order the certificate chain with the root first.
        EncryptionAlgorithm:
          type: string
          description: 'Possible encryption algorithm values:


            | OID | Algorithm | Description |

            |-----|-----------|-------------|

            |1.2.840.113549.1.1.1|RSA|A widely-used asymmetric encryption algorithm that provides secure data transmission, suitable for a variety of security applications including secure communications and data integrity.|

            |1.2.840.113549.1.1.7|RSA-OAEP|An asymmetric encryption algorithm that uses Optimal Asymmetric Encryption Padding (OAEP) to enhance security, suitable for encryption of sensitive information.|

            |1.2.840.113549.1.5.1|PBE-MD2-DES|Outdated and insecure. Not recommended for use.|

            |1.2.840.113549.1.5.3|PBE-MD5-DES|Outdated and insecure. Not recommended for use.|

            |1.2.840.113549.1.5.4|PBE-MD2-RC2-64|Outdated and insecure. Not recommended for use.|

            |1.2.840.113549.1.5.6|PBE-MD5-RC2-64|Outdated and insecure. Not recommended for use.|

            |1.2.840.113549.1.5.10|PBE-SHA1-DES|Suitable for moderate security needs. Not recommended for high-security applications.|

            |1.2.840.113549.1.5.11|PBE-SHA1-RC2-64|Provides moderate security. Not recommended for high-security applications.|

            |1.2.840.113549.1.5.13|PBES2-PKCS5-SHA1|Weak security due to vulnerabilities. Not recommended for use..|

            |1.2.840.113549.1.5.13|PBES2-PKCS5-SHA1-3DES|Weak security due to vulnerabilities. Suitable for moderate security needs but not recommended for high-security applications.|

            |1.2.840.113549.1.5.13|PBES2-PKCS5-SHA256|Suitable for typical security needs. Recommended over SHA-1 but not ideal for high-security applications..|

            |1.2.840.113549.1.5.13|PBES2-PKCS5-SHA384|Strong security, but limited adoption. Suitable for high-security encryption if supported by recipient.|

            |1.2.840.113549.1.5.13|PBES2-PKCS5-SHA512|Strong security, suitable for high-security encryption.|

            |1.2.840.113549.1.12.1.3|PBE-SHA1-3DES|Suitable for securing sensitive data with moderate security needs. Not recommended for high-security applications due to outdated components.|

            |1.2.840.113549.1.12.1.4|PBE-SHA1-2DES|Suitable for moderate security needs. Not recommended for high-security applications.|

            |1.2.840.113549.1.12.1.5|PBE-SHA1-RC2-128|Provides moderate security. Not recommended for high-security applications.|

            |1.2.840.113549.1.12.1.6|PBE-SHA1-RC2-40|Offers low security. Not recommended for sensitive data.|

            |1.2.840.113549.1.12.5.1.3|JCEKS-SHA1-3DES|Java variant of PBE-SHA1-3DES: Suitable for moderate security needs. Not recommended for high-security applications.|

            |1.2.840.113549.3.7|DES-EDE3-CBC|112-bit security (effectively ~80-bit), suitable for legacy compatibility but not recommended for new secure applications.|

            |2.16.840.1.101.3.4.1.2|AES128-CBC|128-bit security, suitable for moderate security data encryption.|

            |2.16.840.1.101.3.4.1.6|AES128-GCM|128-bit security, ideal for secure communications.|

            |2.16.840.1.101.3.4.1.22|AES192-CBC|192-bit security, suitable for higher security data encryption.|

            |2.16.840.1.101.3.4.1.26|AES192-GCM|192-bit security, ideal for secure communications with higher security needs.|

            |2.16.840.1.101.3.4.1.42|AES256-CBC|256-bit security, suitable for highly sensitive data encryption.|

            |2.16.840.1.101.3.4.1.46|AES256-GCM|256-bit security, ideal for secure communications with the highest security needs.|'
