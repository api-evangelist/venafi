  /vedsdk/certificates/Associate:
    post:
      tags:
      - Certificate Management APIs
      summary: Associate an application
      description: 'Allows one or more application objects to use an existing certificate


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificateAssociate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_AssociateRequest'
        required: true
      responses:
        '200':
          description: 'Certificate successfully associated with the specified application(s). The response includes Success: true, and the Warning field may contain additional messages related to the operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_AssociateResponse'
        '400':
          description: Invalid or missing request parameters. The Error property will provide details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_AssociateResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/Dissociate:
    post:
      tags:
      - Certificate Management APIs
      summary: Dissociate an application
      description: 'Detaches one or more application objects and corresponding device objects from an existing certificate.


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificateDissociate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_DissociateRequest'
        required: true
      responses:
        '200':
          description: 'Certificate successfully dissociated from the specified application(s). The response includes Success: true, and the Error field will be null.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_DissociateResponse'
        '400':
          description: Invalid or missing request parameters. The Error property will provide details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_DissociateResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/Push:
    post:
      tags:
      - Certificate Management APIs
      summary: Initiate provisioning
      description: 'Initiates the certificate provisioning to some or all certificate consumers.


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificatePush
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_PushRequest'
        required: true
      responses:
        '200':
          description: 'Certificate successfully pushed to the specified application(s). The response includes Success: true, and the Warning field may contain additional messages related to the operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_PushResponse'
        '400':
          description: Invalid or missing request parameters. The Error property will provide details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_PushResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/Import:
    post:
      tags:
      - Certificate Management APIs
      summary: Import a certificate
      description: 'Imports a certificate and performs reconciliation


        _Required scope: certificate:discover_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_CertificateImport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_ImportRequest'
        required: true
      responses:
        '200':
          description: The certificate was imported successfully. The response body contains the result of the import operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_ImportResponse'
        '400':
          description: Invalid or missing request parameters. The Error property contains details about the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_ImportResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/Reset:
    post:
      tags:
      - Certificate Management APIs
      summary: Reset processing state
      description: 'Resets the processing state of a certificate object and any associated applications.


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_Reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_ResetRequest'
        required: true
      responses:
        '200':
          description: Certificate processing state reset successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_ResetResponse'
        '400':
          description: Invalid or missing request parameters. The Error property contains details about the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_ResetResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/Retry:
    post:
      tags:
      - Certificate Management APIs
      summary: Retry processing
      description: 'Retries processing a certificate from its last unsuccessful lifecycle stage.


        _Required scope: certificate:manage_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_Retry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CertificateRequest_RetryRequest'
        required: true
      responses:
        '200':
          description: Certificate processing retry successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RetryResponse'
        '400':
          description: Invalid or missing request parameters. The Error property contains details about the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_RetryResponse'
      security:
      - AccessToken: []
  /vedsdk/certificates/{guid}/ValidationResults:
    parameters:
    - name: guid
      in: path
      description: Guid representing the certificate for which to get validation results.
      required: true
      schema:
        type: string
    get:
      tags:
      - Certificate Management APIs
      summary: Retrieve certificate validation results
      description: 'Retrieves a list of validation results for the certificate.


        _Required scope: certificate_'
      operationId: Venafi_WebSDK_CertificateRequest_CertificateRequestRest_GetValidationResults
      responses:
        '200':
          description: Validation results retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_ValidationResultsResponse'
        '400':
          description: The guid is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_ValidationResultsResponse'
        '403':
          description: There are insufficient privileges to retrieve validation results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_ValidationResultsResponse'
        '500':
          description: There is an internal server error while retrieving validation results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_ValidationResultsResponse'
        '204':
          description: No validation results are found for the specified certificate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CertificateRequest_ValidationResultsResponse'
      security:
      - AccessToken: []
components:
  schemas:
    WebSDK_CertificateRequest_RevokeRequest:
      type: object
      properties:
        CertificateDN:
          type: string
          description: The Distinguished Name (DN) of the certificate to be revoked.
        Thumbprint:
          type: string
          description: The unique hash (SHA-1) of the certificate to be revoked.
        Reason:
          $ref: '#/components/schemas/Nullable_1_Core_Revocation_RevocationReason_'
        Comments:
          type: string
          description: Optional comments providing additional details about the revocation request.
        Disable:
          type: boolean
          description: If true, disables the certificate in addition to revocation. Defaults to false.
        WorkToDoTimeout:
          type:
          - integer
          - 'null'
          description: The maximum time (in seconds) to wait for revocation processing before returning a response.
          format: int32
      description: The class for certificate revoke method request.
    WebSDK_CertificateRequest_RequestResponse:
      type: object
      properties:
        CertificateDN:
          type: string
          description: The Distinguished Name (DN) of the created certificate.
        Guid:
          type: string
          description: The GUID of the created certificate.
        Devices:
          type: array
          items:
            type: object
            properties:
              DN:
                type: string
                description: The device DN.
              Warning:
                type: string
                description: The warning message if any.
              Applications:
                type: array
                items:
                  type: object
                  properties:
                    DN:
                      type: string
                      description: The application DN.
                    Warning:
                      type: string
                      description: The warning message of any.
                  description: The application response data.
                description: The list of applications.
            description: The class for device response data.
          description: The devices associated with the certificate.
        Error:
          type: string
          description: The error message if any.
        Warning:
          type: string
          description: The warning message if any.
        CertificateData:
          type: string
          description: The certificate data.
        Format:
          type: string
          description: The data format.
        Filename:
          type: string
          description: The filename of the certificate.
        Status:
          type: string
          description: The certificate status.
        Stage:
          type:
          - integer
          - 'null'
          description: The certificate processing stage.
          format: int32
      description: The class for certificate request method response.
    WebSDK_CertificateRequest_ValidateResponse:
      type: object
      properties:
        Error:
          type: string
          description: Error message if any validation process failed.
        Warnings:
          type: array
          items:
            type: string
          description: A list of warning messages encountered during the validation process.
        ValidatedCertificateGUIDs:
          type: array
          items:
            type: string
          description: A list of validated certificate GUIDs.
        ValidatedCertificateDNs:
          type: array
          items:
            type: string
          description: A list of validated certificate DNs.
        Success:
          type: boolean
          description: Indicates whether the validation process was successful.
      description: Certificates validate response.
    WebSDK_CertificateRequest_ImportResponse:
      type: object
      properties:
        CertificateDN:
          type: string
          description: The Distinguished Name (DN) of the imported certificate.
        Guid:
          type: string
          description: The unique identifier of the imported certificate.
        CertificateVaultId:
          type: integer
          description: The vault ID of the imported certificate.
          format: int64
        PrivateKeyVaultId:
          type: integer
          description: The vault ID of the imported private key.
          format: int64
        Error:
          type: string
          description: Contains an error message if the import operation failed.
        Warning:
          type: string
          description: Contains a warning message if there are any warnings during the import operation.
      description: The class for import method response.
    WebSDK_CertificateRequest_CheckPolicyResponse:
      type: object
      properties:
        Policy:
          type: object
          properties:
            Subject:
              type: object
              properties:
                Organization:
                  type: object
                  properties:
                    Value:
                      type: string
                      description: The value.
                    Locked:
                      type: boolean
                      description: The locked flag.
                  description: The organization.
                OrganizationalUnit:
                  type: object
                  properties:
                    Values:
                      type: array
                      items:
                        type: string
                      description: The values as _List`1_.
                    Locked:
                      type: boolean
                      description: The locked flag.
                  description: The organization units.
                City:
                  type: object
                  properties:
                    Value:
                      type: string
                      description: The value.
                    Locked:
                      type: boolean
                      description: The locked flag.
                  description: The city.
                State:
                  type: object
                  properties:
                    Value:
                      type: string
                      description: The value.
                    Locked:
                      type: boolean
                      description: The locked flag.
                  description: The state.
                Country:
                  type: object
                  properties:
                    Value:
                      type: string
                      description: The value.
                    Locked:
                      type: boolean
                      description: The locked flag.
                  description: The country.
              description: The subject.
            KeyPair:
              type: object
              properties:
                KeyAlgorithm:
                  type: object
                  properties:
                    Value:
                      type: string
                      description: The value.
                    Locked:
                      type: boolean
                      description: The locked flag.
