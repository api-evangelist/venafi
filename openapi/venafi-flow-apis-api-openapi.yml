            |Zero (0)|Providing a zero for this value will not filter the results.|'
          format: int32
        TicketPageSize:
          type: integer
          description: The page size of tickets to be enumerated
          format: int32
        TicketPageNumber:
          type: integer
          description: The page number of tickets to be enumerated
          format: int32
    Core_WebSDK_FlowTicketResponse_enumerateapproved:
      type: object
      properties:
        Tickets:
          type: array
          items:
            type: object
            properties:
              Id:
                type: integer
                description: The unique identifier of this ticket
                format: int64
              FlowId:
                type: integer
                description: The reference to its parent Flow configuration
                format: int64
              RequiredApprovals:
                type: integer
                description: Gets the minimum number of approvals required before this ticket is approved
                format: int32
              CreationTime:
                type: string
                description: The time this ticket was created
              RemainingUses:
                type:
                - integer
                - 'null'
                description: Gets the remaining number of uses at the time of creation if the ticket has been approved. If **null** the ticket use is unlimited
                format: int32
              NotBefore:
                type:
                - string
                - 'null'
                description: ''
              ExpiresOn:
                type:
                - string
                - 'null'
                description: The ticket has been approved and can be used until this date. If **null** the ticket does not expire.
              Approvers:
                type: array
                items:
                  type: object
                  properties:
                    Prefix:
                      type: string
                      description: Gets the prefix of the identity provider owning the entry
                    PrefixedName:
                      type: string
                      description: The name of the prefixed.
                    PrefixedUniversal:
                      type: string
                      description: Gets the prefixed universal.
                    Name:
                      type: string
                      description: Gets the name of the entry
                    FullName:
                      type: string
                      description: Gets the full name of the entry
                    Universal:
                      type: string
                      description: Gets the universal (machine-readable) name of the entry
                    IsGroup:
                      type: boolean
                      description: True if the entry represents a group
                    Type:
                      $ref: '#/components/schemas/Core_IdentityType'
                    State:
                      $ref: '#/components/schemas/Core_IdentityEntry_EntryState'
                  description: Describes an Identity
                description: Gets the list of prefixed universals of users/groups who can approve this ticket
              Approvals:
                type: array
                items:
                  type: object
                  properties:
                    Universal:
                      type: string
                      description: The prefixed universal of the user that supplied this approval
                    Comment:
                      type: string
                      description: The optional comment left by the user
                    ApprovalTime:
                      type: string
                      description: The time that this approval was issued
                  description: Information about a specific ticket approval
                description: Gets the list of prefixed universals of users who have approved the request
              FlowProcessId:
                type: integer
                description: The Id of the process blocked by this ticket
                format: int64
              Identifier:
                type: string
                description: The identifier string of the process
              ProductCode:
                type: integer
                description: Gets the product code of the flow that created this ticket
                format: int32
              Environment:
                type: object
                additionalProperties:
                  type: string
                  description: Value
                description: 'The current environment variables of the process blocked by this ticket


                  **Key**: Environment Name'
              PriorEnvironment:
                type: object
                additionalProperties:
                  type: string
                  description: Value
                description: 'The most recent set of environment variables of previous processes that have utilizied this ticket


                  **Key**: Environment Name'
              RejectionStatus:
                $ref: '#/components/schemas/Core_FlowTicketRejectionStatus'
              RejectionComment:
                type: string
                description: Gets the rejection comment if the ticket has been rejected
            description: A ticket inside the FlowTickets system
          description: The flow tickets.
        Message:
          type: string
          description: The error.
