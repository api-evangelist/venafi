          format: int32
    Core_FlowTicketRejectionStatus:
      title: The rejection severity of a rejected ticket
      enum:
      - 0
      - 1
      - 2
      type: integer
      description: "\n\n**0**: **None**  \nTicket has not been rejected\n\n**1**: **Retry**  \nProcess has an issue, fix the issue and retry from the current stage\n\n**2**: **Final**  \nProcess cannot complete and must be restarted from the beginning\n"
      format: int32
