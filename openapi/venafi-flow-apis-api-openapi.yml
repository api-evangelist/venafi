        Result:
          $ref: '#/components/schemas/Core_FlowTicketResult'
        Message:
          type: string
          description: The error.
    Core_WebSDK_FlowTicketRequest_approve:
      required:
      - Comment
      type: object
      properties:
        Comment:
          type: string
          description: A comment to apply to the approval or rejection
        UseCount:
          type:
          - integer
          - 'null'
          description: The maximum number of times the ticket may be used before a new ticket is required. Default is null to allow an unlimited number of times the ticket can be reused.
          format: int32
        NotBefore:
          type: string
          description: The optional earliest time the ticket may be used. ISO 8601 (YYYY-MM-DDTHH:mm:ssZ) format
        Expires:
          type: string
          description: The optional latest time the ticket may be used before the approval expires and a new ticket is required. ISO 8601 (YYYY-MM-DDTHH:mm:ssZ) format
        TicketIds:
          type: array
          items:
            type: integer
            format: int64
          description: A collection of unique flow ticket IDs. Ticket IDs are can be obtained via Enumerate.
        TicketId:
          type: integer
          description: A unique identifier for a flow ticket. A ticket ID can be obtained via Enumerate.
          format: int64
    Core_WebSDK_FlowTicketRequest_reject:
      required:
      - Comment
      - RejectionLevel
      type: object
      properties:
        Comment:
          type: string
          description: A comment to apply to the approval or rejection
