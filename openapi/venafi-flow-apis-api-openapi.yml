        TicketIds:
          type: array
          items:
            type: integer
            format: int64
          description: A collection of unique flow ticket IDs. Ticket IDs are can be obtained via Enumerate.
        TicketId:
          type: integer
          description: A unique identifier for a flow ticket. A ticket ID can be obtained via Enumerate.
          format: int64
