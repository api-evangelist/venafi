          description: The error.
    Core_WebSDK_FlowTicketRequest_countapproved:
      type: object
      properties:
        ProductCode:
          type: integer
          description: 'The product code used to filter which tickets are visible.

            ## Values and Behaviors ##


            |Value|Description|

            |---|---|

            |Specific code|Filter on a specific product code. For example the integer 0x60020001 will filter down to tickets for Code Signing Key Use Flows.|

            |Component only|Filter on a particular component. The component is represented by the high bits in the integer. For example the integer 0x60020000 will interact with any Flow in the Code Signing component, including all product codes from 0x60020001 through 0x6002FFFF|

            |Zero (0)|Providing a zero for this value will not filter the results.|'
          format: int32
    Core_WebSDK_FlowTicketRequest_enumerateapproved:
      required:
      - ProductCode
      - TicketPageSize
      - TicketPageNumber
      type: object
      properties:
