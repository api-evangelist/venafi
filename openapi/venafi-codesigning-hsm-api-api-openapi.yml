            HedgeVariant:
              type: integer
              description: Hedge Required value for AdditionalContext _CryptokiHedgeType_
              format: int32
            ContextData:
              type: string
              description: The base64 representation of the context data
            Mechanism:
              type: integer
              description: Mechanism used for Pre-Hash signing
              format: int32
          description: Parameters for the specific cryptographic operation.
