          type: string
          description: The schema class where algorithm selector policy is applied
        PKIXParameterSets:
          type: array
          items:
            type: string
          description: A list of Venafi PKIX Parameter Set Oid identifying an algorithm
    Core_WebSDK_AlgorithmSelectorWebResponse_get:
      type: object
      properties:
        Selector:
          type: object
          properties:
            Algorithm:
              type: string
              description: Gets the display name for the selected algorithm
            PkixParameterSetOid:
              type: string
              description: Gets the Venafi Pkix Parameter Set Oid for the selected algorithm
            Description:
