components:
  schemas:
    Core_WebSDK_OAuthWebRequest_getrules:
      type: object
      properties:
        ApplicationId:
          type: string
          description: Gets or sets the application identifier
        TrusteePrefixedUniversal:
          type: string
          description: Gets or sets the prefixed universal for the trustee
        TrusteePrefixedUniversals:
          type: array
          items:
            type: string
          description: Gets or sets a list of trustee universals to search on
        MaximumScope:
          type: string
          description: Gets or sets the maximum scope for an application
        Renewable:
          type:
          - boolean
          - 'null'
          description: Gets or sets whether grants for an application should be renewable
        NoExpire:
          type:
          - boolean
          - 'null'
          description: Gets or sets filtering rules that have no expiration. **true** to find rules that don't expire.
        ResolveIdentities:
          type: boolean
          description: If **true**, prefixed universals will be resolved and included in the response in the _IdentityEntries_ field
    Web_SDK_Authentication_OAuthOrderByField:
      title: Enumeration providing ordering options for OAuth results
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      type: integer
      description: "\n\n**0**: **Default**  \nNo order specified\n\n**1**: **Name**  \nOrder results by name\n\n**2**: **Vendor**  \nOrder results by vendor\n\n**3**: **AccessValidity**  \nOrder results by access validity\n\n**4**: **GrantValidity**  \nOrder results by grant validity\n"
      format: int32
    Core_WebSDK_OAuthWebRequest_getjwtmappings:
      type: object
      properties:
        Filter:
          type: string
          description: Gets or sets a generic filter string
        IssuerUris:
          type: array
          items:
            type: string
          description: Gets or sets a list of Issuer URIs
        ResolveIdentities:
          type: boolean
          description: If **true**, prefixed universals will be resolved and included in the response in the _IdentityEntries_ field
    Core_WebSDK_OAuthWebResponse_deleterules:
      type: object
      properties:
        Success:
          type: boolean
          description: 'All requests that are have a valid grant and scope will be accepted with a 200 (OK) HTTP response code. The

            Success variable in the response body will indicate if the **API** call itself was successful.'
        Result:
          $ref: '#/components/schemas/Web_SDK_Authentication_OAuthResult'
        Error:
          type: string
          description: Gets or sets the error
    Core_WebSDK_OAuthWebResponse_grantcount:
      type: object
      properties:
        Success:
          type: boolean
          description: 'All requests that are have a valid grant and scope will be accepted with a 200 (OK) HTTP response code. The

            Success variable in the response body will indicate if the **API** call itself was successful.'
        Result:
          $ref: '#/components/schemas/Web_SDK_Authentication_OAuthResult'
        Error:
          type: string
          description: Gets or sets the error
        Count:
          type: integer
          description: Gets or sets the requested count
          format: int32
    Core_WebSDK_OAuthWebResponse_usercount:
      type: object
      properties:
        Success:
          type: boolean
          description: 'All requests that are have a valid grant and scope will be accepted with a 200 (OK) HTTP response code. The

            Success variable in the response body will indicate if the **API** call itself was successful.'
        Result:
          $ref: '#/components/schemas/Web_SDK_Authentication_OAuthResult'
        Error:
          type: string
          description: Gets or sets the error
        Count:
          type: integer
          description: Gets or sets the requested count
          format: int32
    Core_WebSDK_OAuthWebRequest_getapplications:
      type: object
      properties:
        Filter:
          type: string
          description: Gets or sets a generic filter string
        ApplicationIds:
          type: array
          items:
            type: string
          description: Gets or sets a list of the application identifiers
    Core_WebSDK_OAuthWebRequest_getgrants:
      type: object
      properties:
        GranteePrefixedUniversal:
          type: string
          description: Grantee Prefixed Universal Identity
        ApplicationId:
          type: string
          description: Gets or sets the application identifier
        Start:
          type: integer
          description: Gets or sets the start index for paged APIs
          format: int32
        Count:
          type: integer
          description: Gets or sets the maximum number of results to return for paged APIs
          format: int32
        OrderBy:
          $ref: '#/components/schemas/Web_SDK_Authentication_OAuthOrderByField'
        Descending:
          type: boolean
          description: Gets or sets ordering direction for query APIs
        ResolveIdentities:
          type: boolean
          description: If **true**, prefixed universals will be resolved and included in the response in the _IdentityEntries_ field
    Core_WebSDK_OAuthWebResponse_updaterule:
      type: object
      properties:
        Success:
          type: boolean
          description: 'All requests that are have a valid grant and scope will be accepted with a 200 (OK) HTTP response code. The

            Success variable in the response body will indicate if the **API** call itself was successful.'
        Result:
          $ref: '#/components/schemas/Web_SDK_Authentication_OAuthResult'
        Error:
          type: string
          description: Gets or sets the error
    Core_WebSDK_OAuthWebResponse_enumeraterules:
      type: object
      properties:
        Success:
          type: boolean
          description: 'All requests that are have a valid grant and scope will be accepted with a 200 (OK) HTTP response code. The

            Success variable in the response body will indicate if the **API** call itself was successful.'
        Result:
          $ref: '#/components/schemas/Web_SDK_Authentication_OAuthResult'
        Error:
          type: string
          description: Gets or sets the error
        Rules:
          type: array
          items:
            type: object
            properties:
              Description:
                type: string
                description: Gets or sets the application the description of the rule
              MaximumScope:
                type: string
                description: Gets or sets the maximum scope this rule will grant
              AccessValidity:
                type:
                - integer
                - 'null'
                description: Gets or sets the time an access token issued under this rule is valid
                format: int64
              GrantValidity:
                type:
                - integer
                - 'null'
                description: Gets or sets how long before a grant issued under this rule expires and can no longer be renewed
                format: int64
              Renewable:
                type:
                - boolean
                - 'null'
                description: Gets or sets if a grant issued under this rule is renewable
              TrusteePrefixedUniversal:
                type: string
                description: Gets or sets the identity (user/group) this rule applies to
              ApplicationId:
                type: string
                description: Gets or sets the application that can request access under this rule
            description: Data class holding properties describing a rule used to obtain an OAuth grant automatically
          description: Gets or sets a list of _OAuthRule_ objects
    Core_WebSDK_OAuthWebRequest_setconfiguration:
      type: object
      properties:
        Configuration:
          type: object
          properties:
            SessionPoolSize:
              type: integer
              description: Gets or sets the WebSDK Session Pool (Cache) size, in number of entries
              format: int32
            SessionPoolAge:
              type: integer
              description: Gets or sets the maximum time an entry can be kept in the sesion pool, in seconds
              format: int32
            SessionPoolExpirationInterval:
              type: integer
              description: Gets or sets how often the session expiration process runs
              format: int32
            SessionRightsRefreshInterval:
              type: integer
              description: Gets or sets the maximum number of seconds since the last request after which the stored rights of a session are refreshed from the database
              format: int32
            StrictExpiration:
              type: boolean
              description: Gets or sets the session cache expiration strategy
            StatisticsApiTracking:
              type: boolean
              description: Gets or sets the if API usage is tracked via statistics
            StatisticsTrackingIncludesTime:
              type: boolean
              description: Gets or sets the if API usage statistics track API execution times
            OpenApiEnabled:
              type: boolean
              description: Gets or sets the OpenAPI documentation is accessible
            OpenApiUi:
              type: string
              description: Gets or sets the UI to use for OpenAPI documentation
            DefaultAccessTokenValidity:
              type: integer
              description: Gets or sets the number of seconds an access token is valid if not overriden by application or rule
              format: int32
            DefaultGrantValidity:
              type: integer
              description: Gets or sets the number of seconds a grant is valid if not overriden by application or rule
              format: int32
            DefaultGrantRefreshable:
              type: boolean
              description: Gets or sets whether or not a grant can be refreshed, if not override by application or rule
            UnusedAccessTokenExpiration:
              type: integer
              description: Gets or sets the number of seconds an access token must be expired to consider the grant expired, even if the actual grant expiration is further out
              format: int32
            RefreshEndpointEnabled:
              type: boolean
              description: Gets or sets whether the token refresh endpoint is enabled
            AuthorizeByPassword:
              type: boolean
              description: Gets or sets whether the authentication server accepts username/password as authentication credentials
            AuthorizeByCertificate:
              type: boolean
              description: Gets or sets whether the authentication server accepts certificates as authentication credentials
            AuthorizeByIntegrated:
              type: boolean
              description: Gets or sets whether the authentication server accepts integrated (Windows) authentication
            AuthorizeByJwt:
              type: boolean
              description: Gets or sets whether the authentication server accepts JWT authentication
            AuthorizeDevice:
              type: boolean
              description: Gets or sets whether the authentication server accepts device authentication requests
            DeviceConfiguration:
              type: object
              properties:
                VerificationUri:
                  type: string
                  description: Gets or sets the Uri to verify (confirm) a device authorization request
                VerificationUriCompleteFormat:
                  type: string
                  description: Gets or sets the Uri to verify (confirm) a device authorization request, with a {0} placeholder for string.format use to hold the unique request id
              description: Gets or sets device authorization specific settings
            CertificateConfiguration:
              type: object
              properties:
                AttemptSIDExtensionBeforeSourceField:
                  type: boolean
                  description: Gets or sets whether we should first check and use SID extension from certificate prior to fallback to other source field
                SourceField:
                  type: string
                  description: Gets or sets the certificate field to use to determine identity
                AuthorizedIssuerDns:
                  type: array
