openapi: 3.2.0
info:
  title: Trust Protection Foundation WebSDK Access Management APIs…
  description: '# Introduction

    The Trust Protection Foundation Web SDK is a subset of REST APIs that allow you to:

    * Automate certificate management

    * Integrate with DevOps processes

    * Discover machine identities

    * Extract data to integrate with data warehouses

    * Perform bulk actions

    * Set up and administer Trust Protection Foundation

    * Onboard teams

    * Create custom, automated business logic and flows between internal systems


    All these use cases can be accomplished using the Trust Protection Foundation REST…'
  version: 26.1.1
servers:
- url: /
  description: Current Host
- url: https://REPLACEdnsnameME/
  description: System
- url: https://{dnsname}/
  description: Configurable Hostname
  variables:
    dnsname:
      default: localhost
      description: Production API Hostname
security:
- AccessToken: []
tags:
- name: Access Management APIs
  description: 'The endpoints in this section allow you to manage your OAuth environment.

    Using endpoints described in this section, you can configure your global OAuth properties, assign roles

    to identities, create and manage applications, and create grant rules. After these are in

    place, users can request grants using the authentication server. This section also includes

    descriptions of endpoints that allow you to view and revoke issued grants.'
