  /vedsdk/client/delete:
    post:
      tags:
      - Client Management APIs
      summary: Delete client records
      description: 'Deletes client records in bulk based on the supplied list of clients.


        _Required scope: agent:delete_'
      operationId: ClientWebSDK_ClientSdkService_Delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientWebSDK_DataContracts_BulkRequest'
        required: true
      responses:
        '200':
          description: 'Client records deleted successfully. '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientWebSDK_DataContracts_DeleteResponse_delete'
      security:
      - AccessToken: []
  /vedsdk/client/work/:
    get:
      tags:
      - Client Management APIs
      summary: Get own work
      description: 'Returns all work objects applicable to the caller.


        _Required scope: agent_'
      operationId: ClientWebSDK_ClientSdkService_GetUserWork
      parameters:
      - name: WorkType
        in: query
        description: The tasks that a group of agents can perform.
        schema:
          type: string
      responses:
        '200':
          description: The request was successful, and the response contains the requested work objects applicable to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    WorkName:
                      type: string
                      description: Work name
                    WorkDn:
                      type: string
                      description: Work DN
                    WorkType:
                      type: string
                      description: Work Type
                    AssociatedGroups:
                      type: array
                      items:
                        type: string
                      description: Associated groups
                  description: Represents a work that applies user making request via WebSdk
        '204':
