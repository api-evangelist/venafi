      - name: ClientType
        in: query
        description: The exact registered client category
        schema:
          type: string
      - name: HostName
        in: query
        description: The exact or partial hostname, Fully Qualified Domain Name (FQDN), or domain name where the registered client is installed
        schema:
          type: string
      - name: IPAddress
        in: query
        description: The exact IPv4 or IPV6 address of the system where the registered client is installed
        schema:
          type: string
      - name: LastSeenOn
        in: query
        description: The exact date of clients connecting to Trust Protection Foundation
        schema:
          type: string
      - name: LastSeenOnGreater
        in: query
        description: Find information about clients connecting to Trust Protection Foundation after this exact UTC time in ISO 8601 format (YYYY-MM-DDTHH:MM:SS.mmmmmmmZ)
        schema:
          type: string
      - name: LastSeenOnLess
        in: query
        description: Find information about all clients connecting to Trust Protection Foundation before this exact UTC time. For a time range, make sure the LastSeenOnGreater time is older than the LastSeenOnLess time in ISO 8601 format (YYYY-MM-DDTHH:MM:SS.mmmmmmmZ)
        schema:
          type: string
      - name: MACAddress
        in: query
        description: The exact or partial MAC address where the registered client is installed
        schema:
          type: string
      - name: OSName
        in: query
        description: The exact operating system name of the system where the registered client is installed
        schema:
          type: string
      - name: OSVersion
        in: query
        description: The exact operating system version of the system where the registered client is installed
        schema:
          type: string
      - name: Region
        in: query
        description: The set of clients for a particular geographic area, such as a state or territory
        schema:
          type: string
      - name: SerialNumber
        in: query
        description: The exact or partial hardware serial number of the system where the registered client is installed
        schema:
          type: string
      - name: SID
        in: query
        description: The exact Security Identifier (SID) that corresponds to the UserName that is registered with the client
        schema:
          type: string
      - name: UserName
        in: query
        description: The exact or partial domain or local user name that runs the registered client
        schema:
          type: string
      - name: VirtualMachineId
        in: query
        description: The virtual machine identifier from the UI
        schema:
          type: string
