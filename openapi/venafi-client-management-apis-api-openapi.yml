openapi: 3.2.0
info:
  title: Trust Protection Foundation WebSDK Client Management APIs…
  description: '# Introduction

    The Trust Protection Foundation Web SDK is a subset of REST APIs that allow you to:

    * Automate certificate management

    * Integrate with DevOps processes

    * Discover machine identities

    * Extract data to integrate with data warehouses

    * Perform bulk actions

    * Set up and administer Trust Protection Foundation

    * Onboard teams

    * Create custom, automated business logic and flows between internal systems


    All these use cases can be accomplished using the Trust Protection Foundation REST…'
  version: 26.1.1
servers:
- url: /
  description: Current Host
- url: https://REPLACEdnsnameME/
  description: System
- url: https://{dnsname}/
  description: Configurable Hostname
  variables:
    dnsname:
      default: localhost
      description: Production API Hostname
security:
- AccessToken: []
tags:
- name: Client Management APIs
  description: '## OSName Definitions ##


    * AIX

    * Android

    * BlackBerry

    * BSD

    * HPux

    * iOS

    * Linux

    * MacOS

    * Other

    * Solaris

    * Unknown

    * Windows

    * zOS


    ## ClientType Definitions ##


    |ClientType|Description|

    |---|---|

    |VenafiAgent|Return information about server agent clients|

    |AgentJuniorMachine|Return information about Windows user agent clients running as system|

    |AgentJuniorUser|Return information about Windows user agent clients running as user|

    |Portal|Return information about end user portal…'
paths:
