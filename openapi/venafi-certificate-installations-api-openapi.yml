            schema:
              $ref: '#/components/schemas/CertificateInstanceValidationRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: Certificate installations were submitted for validation.
        '400':
