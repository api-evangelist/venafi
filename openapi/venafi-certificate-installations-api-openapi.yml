      requestBody:
        content:
          application/json:
            examples:
              Certificate instance search request by expression:
                description: Certificate instance search request by expression
                summary: Certificate instance search by expression
                value:
                  expression:
                    operands:
                    - field: ipAddress
                      operator: EQ
                      value: 127.0.0.1
                    - field: hostname
                      operator: EQ
                      value: venafi.com
                    operator: OR
                  ordering:
