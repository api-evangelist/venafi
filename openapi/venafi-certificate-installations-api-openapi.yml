          - KUBERNETES_DISCOVERY
          - AWS_DISCOVERY
          - AZURE_DISCOVERY
          - GCP_DISCOVERY
          type: string
      - in: query
        name: ipAddress
        schema:
          type: string
      - in: query
        name: hostname
        schema:
          type: string
      - in: query
        name: limit
        schema:
          format: int32
          type: integer
