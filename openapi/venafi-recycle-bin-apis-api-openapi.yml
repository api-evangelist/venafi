              format: int32
            Tasks:
              type: array
              items:
                type: string
              description: Gets/sets deletion configuration items
          description: Gets or sets the purge configuration options
      description: Class to represent a RecycleBin request for the WebSDK
    Core_WebSDK_RecycleBinWebResponse_setconfiguration:
      type: object
