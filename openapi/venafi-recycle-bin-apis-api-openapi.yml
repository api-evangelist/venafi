        Start:
          type: boolean
          description: Gets or sets whether to start a task
        Stop:
          type: boolean
          description: Gets or sets whether to stop a task
        PurgeAll:
          type: boolean
          description: Gets or sets whether to purge all items when requesting to start a purge task
    Core_WebSDK_RecycleBinWebRequest:
      type: object
      properties:
        Guid:
          type: string
          description: Gets or sets the GUID of a recycle bin item
        Limit:
          type: integer
          description: Gets or sets the maximum number of items to return for /getcontents
          format: int32
        Start:
          type: boolean
          description: Gets or sets whether to start a task
        Stop:
          type: boolean
