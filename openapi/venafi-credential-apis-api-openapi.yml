          description: The date and time when the credential expires.
        Contact:
          type: array
          items:
            type: object
            properties:
              Prefix:
                type: string
                description: Gets the prefix of the identity provider owning the entry
              PrefixedName:
                type: string
                description: The name of the prefixed.
              PrefixedUniversal:
                type: string
                description: Gets the prefixed universal.
              Name:
                type: string
                description: Gets the name of the entry
              FullName:
                type: string
                description: Gets the full name of the entry
              Universal:
                type: string
                description: Gets the universal (machine-readable) name of the entry
              IsGroup:
                type: boolean
                description: True if the entry represents a group
              Type:
                $ref: '#/components/schemas/Core_IdentityType'
              State:
                $ref: '#/components/schemas/Core_IdentityEntry_EntryState'
            description: Describes an Identity
          description: A list of identity entries representing the contacts responsible for the credential.
        Shared:
          type: boolean
          description: '**true** if the credential is shared; otherwise, **false**.'
        FriendlyName:
          type: string
          description: The user-friendly name of the credential.
        Classname:
          type: string
          description: The class name that defines the type of the credential.
        Values:
          type: array
          items:
            type: object
            properties:
              Name:
                type: string
                description: The name.
              Type:
                type: string
                description: The type.
              Value:
                type: string
                description: The value.
            description: ''
          description: A list of name-value pairs representing the credential's attributes.
        CredentialPath:
          type: string
