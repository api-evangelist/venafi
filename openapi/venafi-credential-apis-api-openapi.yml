              Name:
                type: string
                description: The name.
              Type:
                type: string
                description: The type.
              Value:
                type: string
                description: The value.
            description: ''
          description: A list of name-value pairs representing the credential's attributes.
        CredentialPath:
          type: string
          description: The distinguished name (DN) path of the credential.
    WebSDK_CRCyberArkRest_CyberArkCredentialsWebRequest:
      type: object
      properties:
        ConnectorName:
          type: string
          description: The name of the CyberArk Credential Connector to use
        CyberArkUsername:
          type: string
          description: Gets or sets the CyberArk username.
        CyberArkPassword:
          type: string
          description: Gets or sets the CyberArk password.
        Username:
          type: string
          description: 'Gets or sets the username.

            If this property is present in the request (even if empty or null), a UsernamePassword credential is created.

            If this property is not present in the request, a Password-only credential is created.'
        AppID:
          type: string
