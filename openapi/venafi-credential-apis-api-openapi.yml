      type: integer
      description: "\n\n**1**: **Success**  \nOperation completed successfully.\n\n**2**: **InvalidArgument**  \nAn invalid method argument was passed to a method.\n\n**3**: **InvalidArgumentRange**  \nAn argument value is not within the range accepted by a method.\n\n**4**: **MismatchedArguments**  \nOne, or more, method argument counts do not match.\n\n**5**: **NotImplemented**  \nThe method has not been implemented.\n\n**6**: **InvalidDestinationList**  \nA method output argument list is invalid.\n\n**7**: **InsufficientPrivileges**  \nThe method call has insufficient permissions to perform an operation.\n\n**8**: **InvalidOperation**  \nA method call has been attempted using an invalid or disposed \ninstantiated **Config** object.\n\n**9**: **UnexpectedAssemblyError**  \nAn unexpected error occurred within a called assembly.\n\n**10**: **InvalidNullArgument**  \nA null argument was passed to a method that does not allow null.\n\n**11**: **FailedToObtainConfig**  \nCould not get a config handle.\n\n**12**: **FailedToObtainSecretStore**  \nCould not get a secret store handle.\n\n**13**: **InvalidContainerPath**  \nThe provided container path does not start at the credentials root.\n\n**14**: **RemoteError**  \nA remote request failed; see Error property for details\n\n**100**: **AttributeDoesNotExist**  \nThe request attribute does not exist.\n\n**101**: **AttributeAlreadyExists**  \nThe attribute name already exists within the attribute schema, or, as an \noptional or mandatory attribute to a class.\n\n**102**: **AttributeNotFound**  \nThe attribute was not within the attribute schema, or, was not found to \nhave a value for an object.\n\n**103**: **AttributeValueExists**  \nA matching attribute value already exists for an object.\n\n**104**: **AttributeStillInUse**  \nThe attribute cannot be removed from the attribute schema as the \nattribute is still in use by one, or more, objects.\n\n**105**: **AttributeNameTooLong**  \nThe attribute cannot be defined as the attribute name exceeds the \nmaximum defined attribute name length.\n\n**106**: **AttributeReferenceDoesNotExist**  \nAn attribute reference cannot be added to a schema class definition \nas the attribute does not exist within the attribute schema.\n\n**107**: **AttributeSyntaxCollision**  \nThe attribute schema definition cannot be created as an attribute \nalready exists within the attribute schema with a different syntax.\n\n**108**: **AttributePropertyCollision**  \nThe attribute schema definition cannot be created as an attribute \nalready exists within the attribute schema with conflicting attribute \nproperties.\n\n**109**: **CannotRemoveMandatory**  \nThe attribute cannot be removed from an class schema definition as te \nattribute is a mandatory attribute value for the class.\n\n**110**: **AttributeValueIsMandatory**  \nAn object cannot be created as an class mandatory attribute value has \nnot been set.\n\n**111**: **AttributeValueTooLong**  \nAn attribute value cannot be written as the value of the attribute \nexceeds the maximum permitted value length.\n\n**112**: **IllegalAttributeForClass**  \nAn attribute value cannot be written as the schema class definition \ndoes not define the attribute as being mandatory or optional.\n\n**113**: **InvalidAttributeDN**  \nAn attribute value cannot be written as the object distinguished name, \ncontained within the attribute value, does not exist.\n\n**114**: **AttributeValueDoesNotExist**  \nAn attribute value was not found on an object.\n\n**115**: **AttributeIsSingleValued**  \nAn attribute value cannot be written as the attribute already has a \nvalue on an object and the attribute is defined as having only a single \nvalue.\n\n**116**: **AttributeIsReadOnly**  \nAn attribute value cannot be written since it is marked as read-only.\n\n**117**: **AttributeIsHidden**  \nAn attribute value cannot be written since it is marked as hidden.\n\n**200**: **ClassDoesNotExist**  \nNo schema class definition exists with a matching name.\n\n**201**: **ClassAlreadyExists**  \nA schema class definition already exists with that name.\n\n**202**: **ClassStillInUse**  \nThe schema class definition cannot be removed from the schema as one, \nor more, objects of the class still exist.\n\n**203**: **ClassNameTooLong**  \nThe schema class definition cannot be created as the name exceeds the \nmaximum name permitted for a schema class definition.\n\n**204**: **ClassInvalidSuperClass**  \nThe schema class definition cannot be created due to the fact that one \nof the definitions super-classes do not exist.\n\n**205**: **ClassInvalidContainmentClass**  \nThe schema class definition cannot be created due to the fact that one \nof the definitions contained by classes do not exist.\n\n**206**: **ClassInvalidNamingAttribute**  \nThe schema class definition cannot be created due to the fact that one \nof the definitions naming attributes are not defined within the schema \nattribute definitions.\n\n**207**: **ClassInvalidMandatoryAttribute**  \nThe schema class definition cannot be created due to the fact that one \nof the definitions mandatory attributes are not defined within the schema \nattribute definitions.\n\n**208**: **ClassInvalidOptionalAttribute**  \nThe schema class definition cannot be created due to the fact that one \nof the definitions optional attributes are not defined within the schema \nattribute definitions.\n\n**209**: **ClassInvalidName**  \nThe schema class definition cannot be created due to the fact that the \nclass name is an empty name.\n\n**210**: **ClassInvalidContainmentSubClass**  \nThe schema class definition cannot be created due to the fact that one \nof the definitions contained by super-classes do not exist.\n\n**211**: **ClassInvalidStructure**  \nThe schema class definitions cannot be loaded due to one, or more, \ninvalid class or attribute relations.\n\n**300**: **PolicyDoesNotExist**  \nNo matching policy was found for the class and attribute combination \nfor the object.\n\n**301**: **PolicyLockStateCollision**  \nAn existing policy was found for the class and attribute combination \nfor the object; however, the existing policy lock state does not match \nthe lock state of the policy being added.\n\n**350**: **LockNameAlreadyExists**  \nAn existing lock was found for the name given in an new lock attempt.\n\n**351**: **LockNameDoesNotExist**  \nThe specified name is not locked.\n\n**352**: **LockNameOwnedByAnother**  \nThe specified name is locked by another owner.\n\n**353**: **LockNameLimitReached**  \nThe specified name, or category, already has reached the specified \nconcurrent locks allowed limit.\n\n**354**: **LockNameAttemptTimedOut**  \nThe specified name is locked by another owner; or, has reached the \nspecified concurrent locks allowed limit and could not be acquired \nwithint the specified timeout interval.\n\n**400**: **ObjectDoesNotExist**  \nThe specified object does not exist.\n\n**401**: **ObjectAlreadyExists**  \nAn object cannot be created as an object, with a matching name, already \nexists.\n\n**402**: **ObjectHasChildren**  \nThe object cannot be deleted as the object has one, or more, subordinate \nchildren objects.\n\n**403**: **ObjectNameTooLong**  \nThe object cannot be created as the object name exceeds the maximum \npermitted name length for an object.\n\n**404**: **ObjectDepthTooDeep**  \nThe object cannot be created as the object hiearchical parent count \nexceeds the maximum object depth permitted.\n\n**405**: **ObjectInvalidName**  \nThe object cannot be created due to the fact that the object name is \nempty.\n\n**406**: **ObjectInvalidClass**  \nThe object cannot be created due to the fact that no schema class \ndefinition was found.\n\n**407**: **ObjectInvalidContainment**  \nThe object cannot be created due to the fact that the parent object's \nschema class definition is not defined as a contained-by class within \nthe schema class definition.\n\n**408**: **ObjectMandatoryMissing**  \nThe object cannot be created due to the fact that one, or more, \nmandatory attributes, as defined by the object's schema class definition \nwere not provided.\n\n**409**: **ObjectIsReadOnly**  \nThe object cannot be modified.\n\n**410**: **ObjectInvalidOperation**  \nThe operation not allowed on the object.\n\n**500**: **DriverMissingDSN**  \nNo database connection information was found for a storage driver.\n\n**501**: **DriverMissingDatabaseName**  \nThe database connection information does not define the storage driver's \ndatabase name.\n\n**502**: **DriverDatabaseError**  \nAn error occurred between the storage driver and it's database.\n\n**503**: **DriverTransactionError**  \nA transaction error occurred during a write operation within a storage \ndriver.\n\n**504**: **DriverTransactionCollision**  \nAn existing write operation between the storage driver and a database \nis already in progress.\n\n**505**: **DriverGenerationUpdateError**  \nAn attempt to update the storage drivers schema generational qualifier \nfailed.\n\n**600**: **CacheLockException**  \nAn operation cannot be completed as a schema cache lock management error \noccurred.\n\n**601**: **CacheEntryNotFound**  \nNo matching entry name was found within a schema cache.\n\n**602**: **CacheEntryAlreadyExists**  \nAn entry could not be added to a schema cache as an entry with a \nmatching name already exists.\n\n**603**: **CacheEntryIsSuperior**  \nAn entry could not be added to the schema cache as an entry with \na matching name and definitions exist.  However, the matching \nentry contains additional definitions.\n\n**604**: **CacheEntryIsIncompatible**  \nAn entry could not be added to a schema cache as an entry with a \nmatching name, but with conflicting definitions.\n\n**700**: **XmlInvalidStructure**  \nThe XML document structure is invalid for this purpose.\n\n**701**: **XmlMissingNaming**  \nAn XML element is missing the name attribute.\n\n**702**: **XmlMissingSyntax**  \nAn XML element is missing the syntax attribute.\n\n**703**: **XmlMissingProperty**  \nAn XML element is missing the property attribute.\n\n**704**: **XmlUnknownElementAttribute**  \nAn XML element has an unknown attribute.\n\n**800**: **AdaptableCredentialNotSupportedType**  \nThe represented credential type by the Adaptable Credential is not supported.\n\n**801**: **AdaptableCredentialScriptHashMismatch**  \nThe Adaptable Credential PowerShell script is modified.\n\n**802**: **AdaptableCredentialScriptError**  \nThere is an error returned by the Adaptable Credential PowerShell script.\n\n**803**: **AdaptableCredentialInvalidConnectorData**  \nThe Adaptable Connector data is invalid.\n\n**804**: **AdaptableCredentialUnexpectedScriptResult**  \nAn unexpected Result is returned by the Adaptable Credential PowerShell script.\n\n**1000**: **SecretStoreFailed**  \nThe credential data could not be stored in secret store\n\n**1001**: **AddAttributeFailed**  \nAttributes could not be added to vault object\n\n**1002**: **UnexpectedException**  \nEncountered an exception that was not handled\n\n**1003**: **PartialDeleteFailure**  \nEncountered an a problem deleting a object in a recursive delete; partial delete may already have happened\n\n**1004**: **CredentialTypeMismatch**  \nTried to update a credential with a credential of a different type\n\n**1005**: **NoDriver**  \nCould not find a driver for the credential object\n\n**1006**: **VaultTypeMismatch**  \nThe secret stored in the vault doesn't match the type the credential expects\n\n**1007**: **DriverDenied**  \nThe credential driver denied renaming the credential\n\n**1008**: **VaultDataUnrecognized**  \nThe vault data was not any support format\n\n**1009**: **KeyStoreFailed**  \nThe credential failed to be stored in the KeyStore\n\n**1010**: **CredentialIsInRecycleBin**  \nThe credential failed because it was already in the recycle bin and should be purged prior to reimporting it\n\n**1011**: **CredentialMissingPrivateData**  \nThe credential is missing private data required for its type (e.g., private key for a certificate or password for Username credential)\n"
      format: int32
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
