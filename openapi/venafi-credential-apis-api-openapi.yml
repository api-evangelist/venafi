openapi: 3.2.0
info:
  title: Trust Protection Foundation WebSDK Credential APIs API
  description: '# Introduction

    The Trust Protection Foundation Web SDK is a subset of REST APIs that allow you to:

    * Automate certificate management

    * Integrate with DevOps processes

    * Discover machine identities

    * Extract data to integrate with data warehouses

    * Perform bulk actions

    * Set up and administer Trust Protection Foundation

    * Onboard teams

    * Create custom, automated business logic and flows between internal systems


    All these use cases can be accomplished using the Trust Protection Foundation REST…'
  version: 26.1.1
servers:
- url: /
  description: Current Host
- url: https://REPLACEdnsnameME/
  description: System
- url: https://{dnsname}/
  description: Configurable Hostname
  variables:
    dnsname:
      default: localhost
      description: Production API Hostname
security:
- AccessToken: []
tags:
- name: Credential APIs
  description: 'The Credentials interface stores information about credentials for use in requesting certificates

    and other activities.'
paths:
  /vedsdk/credentials/adaptable/create:
    post:
      tags:
      - Credential APIs
      summary: Create Adaptable credential
      description: 'Create an Adaptable Credential, which is a reference to a vault secret.


        _Required scope: security:manage_'
      operationId: Venafi_WebSDK_CRAdaptableRest_CRAdaptableRest_Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSDK_CRAdaptableRest_AdaptableCredentialsWebRequest_create'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSDK_CRAdaptableRest_AdaptableCredentialsWebResponse_create'
        '403':
          description: ' The API requires a scope not granted to the provided access token '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Web_SDK_Authentication_OAuthError'
        '400':
          description: ' Missing or invalid request property. '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Web_SDK_Authentication_OAuthError'
        '401':
          description: ' A valid access token is required. '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Web_SDK_Authentication_OAuthError'
      security:
      - AccessToken: []
  /vedsdk/credentials/adaptable/update:
