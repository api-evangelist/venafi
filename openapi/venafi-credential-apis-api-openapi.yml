components:
  schemas:
    Core_WebSDK_CredentialsWebRequest_delete:
      required:
      - CredentialPath
      type: object
      properties:
        CredentialPath:
          type: string
          description: DN of the credential to delete
    Core_WebSDK_CredentialsWebResponse_retrieve:
      type: object
      properties:
        Shared:
          type: boolean
          description: '**true** if shown when browsing for credentials; otherwise, **false**.'
        Contact:
          type: array
          items:
            type: object
            properties:
              Prefix:
                type: string
                description: Gets the prefix of the identity provider owning the entry
              PrefixedName:
                type: string
                description: The name of the prefixed.
              PrefixedUniversal:
                type: string
                description: Gets the prefixed universal.
              Name:
                type: string
                description: Gets the name of the entry
              FullName:
                type: string
                description: Gets the full name of the entry
              Universal:
                type: string
                description: Gets the universal (machine-readable) name of the entry
              IsGroup:
                type: boolean
                description: True if the entry represents a group
              Type:
                $ref: '#/components/schemas/Core_IdentityType'
              State:
                $ref: '#/components/schemas/Core_IdentityEntry_EntryState'
            description: Describes an Identity
          description: The contact.
        Expiration:
          type: string
          description: Expiration date of the credential (in MS Dateime JSON format - milliseconds since 1/1/1970)
        EncryptionKey:
          type: string
          description: The encryption key.
        Description:
          type: string
          description: The description.
        FriendlyName:
          type: string
          description: The friendly name.
        Classname:
          type: string
          description: The classname.
        Values:
          type: array
          items:
            type: object
            properties:
              Name:
                type: string
                description: The name.
              Type:
                type: string
                description: The type.
              Value:
                type: string
                description: The value.
            description: ''
          description: The description.
        Result:
          $ref: '#/components/schemas/Core_CredentialResult'
    Core_WebSDK_CredentialsWebResponse_create:
      type: object
      properties:
        Result:
          $ref: '#/components/schemas/Core_CredentialResult'
    Core_WebSDK_CredentialsWebRequest_rename:
      required:
      - CredentialPath
      - NewCredentialPath
      type: object
      properties:
        CredentialPath:
          type: string
          description: The DN of the credential to rename
        NewCredentialPath:
          type: string
          description: The new DN of the credential. Must be the same parent DN as *CredentialPath*, move is not allowed
    Core_WebSDK_CredentialsWebRequest_retrieve:
      required:
      - CredentialPath
      type: object
      properties:
        CredentialPath:
          type: string
          description: The DN of the credential to retrieve
    Core_WebSDK_CredentialsWebResponse_rename:
      type: object
      properties:
        Result:
          $ref: '#/components/schemas/Core_CredentialResult'
    Core_IdentityType:
      title: Enumeration defining Identity type objects
      enum:
      - 0
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      type: integer
      description: "\n\n**0**: **Undefined**  \nUndefined\n\n**1**: **User**  \nUser object\n\n**2**: **Group**  \nGroup object\n\n**4**: **Container**  \nContainer of users and groups\n\n**8**: **DistributionList**  \nDistribution List\n\n**16**: **Machine**  \nMachine\n\n**32**: **Provider**  \nThe Identity Provider\n\n_This field is a flag and the actual value will be the sum of all applicable enumeration values._\n"
      format: int32
    Core_WebSDK_CredentialsWebResponse_enumerate:
      type: object
      properties:
        CredentialInfos:
          type: array
          items:
            type: object
            properties:
              ClassName:
                type: string
                description: Gets/sets the config class name
              FullName:
                type: string
                description: Gets/sets the full path and name of the credential
            description: Class describing a credential item
          description: A list of credential objects matching the criteria
        Result:
          $ref: '#/components/schemas/Core_CredentialResult'
    WebSDK_CRCyberArkRest_CyberArkCredentialsWebResponse:
