              Type:
                $ref: '#/components/schemas/Core_IdentityType'
              State:
                $ref: '#/components/schemas/Core_IdentityEntry_EntryState'
            description: Describes an Identity
          description: The contact.
        Expiration:
          type: string
          description: Expiration date of the credential (in MS Dateime JSON format - milliseconds since 1/1/1970)
        EncryptionKey:
          type: string
          description: The encryption key.
        Description:
          type: string
          description: The description.
        FriendlyName:
          type: string
          description: The friendly name.
        Classname:
          type: string
          description: The classname.
        CredentialInfos:
          type: array
          items:
            type: object
            properties:
