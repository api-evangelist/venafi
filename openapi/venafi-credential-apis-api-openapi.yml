      - AccessToken: []
  /vedsdk/credentials/cyberark/create:
    post:
      tags:
      - Credential APIs
      summary: Create CyberArk credential
      description: 'Create an entry in the policy folder to match credential information in a CyberArk Safe.


        _Required scope: security:manage_'
