              State:
                $ref: '#/components/schemas/Core_IdentityEntry_EntryState'
            description: Describes an Identity
          description: A list of identity entries representing the contacts responsible for the credential.
        Shared:
          type: boolean
          description: '**true** if the credential is shared; otherwise, **false**.'
        FriendlyName:
          type: string
          description: The user-friendly name of the credential.
        Classname:
          type: string
          description: The class name that defines the type of the credential.
        Values:
          type: array
