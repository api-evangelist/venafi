    Core_SchemaAttribute_Syntaxes:
      title: Data typing for values of a schema attribute
      enum:
      - 0
      - 2
      - 2
      - 5
      - 5
      - 7
      - 7
      - 11
      - 11
      - 24
      - 24
      - 24
      - 25
      - 26
      - 27
      - 28
      type: integer
      description: "\n\n**0**: **None**  \nA default internal enumeration.\n\n**2**: **Boolean**  \nThe attribute value is a boolean.\n\n**2**: **Bool**  \nThe attribute value is a boolean.\n\n**5**: **CaseIgnoreString**  \nThe attribute value is a case insensitive string.\n\n**5**: **String**  \nThe attribute value is a case insensitive string.\n\n**7**: **DistinguishedName**  \nThe attribute value is the complete name of an object within \nthe storage system.\n\n**7**: **DN**  \nThe attribute value is the complete name of an object within \nthe storage system.\n\n**11**: **Integer**  \nThe attribute value is an integer.\n\n**11**: **Int**  \nThe attribute value is an integer.\n\n**24**: **Date**  \nThe attribute value is representing a date/time value.\n\n**24**: **Time**  \nThe attribute value is representing a date/time value.\n\n**24**: **DateTime**  \nThe attribute value is representing a date/time value.\n\n**25**: **Identity**  \nThe attributes value is an identity entry value\n\n**26**: **Secret**  \nThe attribute value is a vault ID (vault data is encrypted in secret store)\n\n**27**: **CertificateSecret**  \nThe attribute value is a certificate vault ID (vault data is cleartext in secret store)\n\n**28**: **File**  \nThe attribute value is a vault ID (vault data is cleartext in secret store)\n"
      format: int32
