      in: path
      description: Object GUID
      required: true
      schema:
        type: string
    get:
      tags:
      - Permission APIs
      summary: Gets object trustees
      description: 'Returns a list of identities with permission to the object


        _Required scope: security_'
      operationId: Venafi_Core_WebSDK_PermissionsRest_GetPrincipalsForObject
      responses:
        '200':
          description: Principals returned
          content:
            application/json:
              schema:
                type: array
