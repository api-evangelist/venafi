    Ssh_WebSDK_DataContract_KeyProcessStatus:
      title: The possible process status result codes that can occur while Trust Protection Foundation manages public and private keys for devices that use Secure Shell
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      type: integer
      description: "\n\n**0**: **NoStatus**  \nIndicates that no status is available for the key.\n\n**1**: **Provisioning**  \nIndicates that key is being provisioned (added or edited) to its device.\n\n**2**: **Removing**  \nIndicates that key is being removed from its device.\n\n**3**: **FailedToProvision**  \nIndicates that key failed to provision (added or edited) to its device.\n\n**4**: **FailedToRemove**  \nIndicates that key failed to be removed from its device.\n\n**5**: **CleaningUp**  \nIndicates that the old version of the public key is being cleaned up.\n\n**6**: **PendingApproval**  \nIndicates that a key operation is pending approval.\n\n**7**: **PendingMyApproval**  \nIndicates that a key operation is pending approval from the current user.\n"
      format: int32
