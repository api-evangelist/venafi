openapi: 3.2.0
info:
  title: Trust Protection Foundation WebSDK SSH Management APIs API
  description: '# Introduction

    The Trust Protection Foundation Web SDK is a subset of REST APIs that allow you to:

    * Automate certificate management

    * Integrate with DevOps processes

    * Discover machine identities

    * Extract data to integrate with data warehouses

    * Perform bulk actions

    * Set up and administer Trust Protection Foundation

    * Onboard teams

    * Create custom, automated business logic and flows between internal systems


    All these use cases can be accomplished using the Trust Protection Foundation REST…'
  version: 26.1.1
servers:
- url: /
  description: Current Host
- url: https://REPLACEdnsnameME/
  description: System
- url: https://{dnsname}/
  description: Configurable Hostname
  variables:
    dnsname:
      default: localhost
      description: Production API Hostname
security:
- AccessToken: []
tags:
- name: SSH Management APIs
  description: 'The SSH Management APIs allow to manage device keys and keysets. This interface is valid only if you purchased SSH Manager for Machines.


    All product-supported operations are exposed via this API, including key operations (addition, removal, and editing of keys), rotation and

    methods to get the actual state of data. For more information about the SSH objects, see the Web SDK Object class reference.'
paths:
  /vedsdk/ssh/rules:
    get:
      tags:
      - SSH Management APIs
      summary: Search key authorization rules
      description: 'Returns key authorization rules and the total number of key authorization rules that match the specified search filters.


        _Required scope: ssh_'
      operationId: Venafi_Ssh_WebSDK_SshRestService_GetAuthRules
      parameters:
      - name: offset
        in: query
        description: Number of rules to skip from the beginning.
        schema:
          type: string
      - name: limit
        in: query
        description: Number of rules to take.
        schema:
          type: string
      - name: accounts
        in: query
        description: Comma separated list of accounts.
        schema:
          type: string
      - name: hosts
        in: query
        description: Comma separated list of hosts.
        schema:
          type: string
      - name: serverips
        in: query
        description: Comma separated list of server ip addresses.
        schema:
          type: string
      - name: keyalgorithms
        in: query
        description: Comma separated list of key algorithms.
        schema:
          type: string
      - name: keyfingerprints
        in: query
        description: Comma separated list of key fingerprints.
        schema:
          type: string
      responses:
        '200':
          description: The response body contains the list of key authorization rules that match the specified search filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ssh_WebSDK_AuthRulesResponse'
        '500':
          description: An unexpected error occurred during the key authorization rules search process. The ErrorDetails property contains details about the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ssh_WebSDK_AuthRulesResponse'
        '400':
          description: The request was invalid due to incorrect parameters (e.g., invalid key algorithm). The ErrorDetails property contains details about the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ssh_WebSDK_AuthRulesResponse'
      security:
      - AccessToken: []
  /vedsdk/ssh/TestDeviceConnection:
    post:
