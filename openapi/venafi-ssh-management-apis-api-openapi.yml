      description: "\n\n**1**: **IsRootAccessOrphan**  \nRoot access orphan\n\n**2**: **IsClientAccessOrphan**  \nClient access orphan\n\n**3**: **IsPrivateKeyOrphan**  \nPrivate key orphan\n\n**4**: **IsKnownHostOrphan**  \nKnown host orphan\n\n**5**: **IsRootAccess**  \nRoot access\n\n**6**: **IsDuplicateClientPrivateKey**  \nDuplicate client private key\n\n**7**: **IsIllegalAlgorithm**  \nIllegal algorithm\n\n**8**: **IsIllegalProtocolVersion**  \nIllegal protocol version\n\n**9**: **IsIllegalVendorFormat**  \nIllegal vendor format\n\n**10**: **IsIllegalForcedCommand**  \nIllegal forced command\n\n**11**: **IsIllegalSourceRestrictions**  \nIllegal source restriction\n\n**12**: **IsMissingOptions**  \nMissing option\n\n**13**: **IsKeyOlderThanAllowed**  \nOlder than allowed\n\n**16**: **IsSharedPrivateKey**  \nShared private key\n\n**17**: **IsUnEncryptedKey**  \nUnencrypted key\n\n**18**: **IsSharedServerAccount**  \nShared server account\n\n**19**: **IsPassphraseUnknown**  \nPassphrase unknown\n\n**20**: **IsUnknownClient**  \nUnknown client\n\n**21**: **KeyWasNotRotated**  \nKey was not rotated\n\n**22**: **IsEnvironmentCrossing**  \nEnvironment crossing\n\n**33**: **IsDuplicateHostPrivateKey**  \nDuplicate host private key\n\n**35**: **IsSymbolicLinkKey**  \nKey or some of its parent directories is a symbolic link\n\n**36**: **IsTooOpenPrivateKeyPermissions**  \nPrivate key allows other users to read its material\n\n**37**: **IsNotApprovedKeyEncryptionAlgorithm**  \nNot approved PBE algorithm is used for a key\n\n**38**: **IsDisallowedKeyFormat**  \nDisallowed key format\n"
