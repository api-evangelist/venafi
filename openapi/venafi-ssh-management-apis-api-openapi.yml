    Ssh_WebSDK_DataContract_KeysetProcessStatus:
      title: The possible process status result codes that can occur while Trust Protection Foundation manages public and private keys for devices that use Secure Shell
      enum:
      - 5
      - 6
      - 7
      - 8
      - 9
      - 10
      - 11
      type: integer
      description: "\n\n**5**: **Rotating**  \nIndicates that keyset is being rotated.\n\n**6**: **FailedToRotate**  \nIndicates that keyset had error during rotation.\n\n**7**: **KeyOperationRunning**  \nIndicates that at least one add, remove, or options edit operation is occurring with key of the keyset.\n\n**8**: **RotationSuspended**  \nIndicates that keyset rotation is suspended. Waiting for the user to finish manual server reconfiguration, and then press the Resume button.\n\n**9**: **RollingBack**  \nIndicates that keyset rotation is in the process of moving back to a previous state.\n\n**10**: **PendingApproval**  \nIndicates that the keyset has at least one key operation which is pending approval.\n\n**11**: **PendingMyApproval**  \nIndicates that the keyset has at least one key operation which is pending approval from the current user.\n"
      format: int32
