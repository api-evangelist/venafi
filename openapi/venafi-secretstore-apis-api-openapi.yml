        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebRequest_retrieve'
        required: true
      responses:
        '200':
          description: The certificate was successfully retrieved from the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse_retrieve'
        '400':
          description: The request was invalid, possibly due to missing required properties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
        '401':
          description: The user is not authorized to retrieve the certificate from the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
        '500':
          description: An error occurred on the server while retrieving the certificate from the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
      security:
      - AccessToken: []
