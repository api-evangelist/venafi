openapi: 3.2.0
info:
  title: Trust Protection Foundation WebSDK SecretStore APIs API
  description: '# Introduction

    The Trust Protection Foundation Web SDK is a subset of REST APIs that allow you to:

    * Automate certificate management

    * Integrate with DevOps processes

    * Discover machine identities

    * Extract data to integrate with data warehouses

    * Perform bulk actions

    * Set up and administer Trust Protection Foundation

    * Onboard teams

    * Create custom, automated business logic and flows between internal systems


    All these use cases can be accomplished using the Trust Protection Foundation REST…'
  version: 26.1.1
servers:
- url: /
  description: Current Host
- url: https://REPLACEdnsnameME/
  description: System
- url: https://{dnsname}/
  description: Configurable Hostname
  variables:
    dnsname:
      default: localhost
      description: Production API Hostname
security:
- AccessToken: []
tags:
- name: SecretStore APIs
  description: SecretStore APIs
paths:
  /vedsdk/X509CertificateStore/add:
    post:
      tags:
      - SecretStore APIs
      summary: Add an X509 certificate
      description: 'This method validates the request and adds either a single certificate or a collection of certificates to the certificate store.

        If a single certificate is added, the method logs the event and returns the vault ID of the added certificate.


        _Required scope: certificate:manage_'
      operationId: Venafi_Core_WebSDK_X509CertificateStoreRest_Add
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebRequest_add'
        required: true
      responses:
        '200':
          description: The certificate was successfully added to the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse_add'
        '400':
          description: The request was invalid, possibly due to missing required properties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
        '401':
          description: ' The user is not authorized to add the certificate to the vault.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
        '500':
          description: ' An error occurred on the server while adding the certificate to the vault.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
      security:
      - AccessToken: []
  /vedsdk/X509CertificateStore/lookup:
    post:
      tags:
      - SecretStore APIs
      summary: Lookup X509 certificates
      description: 'This method validates the request and looks up certificates in the certificate store based on the provided criteria.

        If a certificate is provided, it looks up the vault ID of the certificate.

        If an owner distinguished name (DN) is provided, it looks up all certificates owned by that DN.

        If a name and value are provided, it looks up all certificates matching the name and value.


        _Required scope: restricted_'
      operationId: Venafi_Core_WebSDK_X509CertificateStoreRest_Lookup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebRequest_lookup'
        required: true
      responses:
        '200':
          description: The certificates were successfully looked up in the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse_lookup'
        '400':
          description: The request was invalid, possibly due to missing required properties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
        '401':
          description: The user is not authorized to look up the certificates in the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
        '500':
          description: An error occurred on the server while looking up the certificates in the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
      security:
      - AccessToken: []
  /vedsdk/X509CertificateStore/lookupexpiring:
    post:
      tags:
      - SecretStore APIs
      summary: Lookup expiring X509 certificates
      description: 'This method validates the request and looks up certificates in the certificate store that are expiring within the specified number of days.

        If an owner distinguished name (DN) is provided, it looks up all certificates owned by that DN that are expiring within the specified number of days.


        _Required scope: restricted_'
      operationId: Venafi_Core_WebSDK_X509CertificateStoreRest_LookupExpiring
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebRequest_lookupexpiring'
