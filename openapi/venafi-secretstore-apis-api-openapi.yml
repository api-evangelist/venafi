    Nullable_1_Core_VaultType_:
      title: Enumerations of data types stored in the vault, if the Data should be secret the Secret bit should be set
      enum:
      - 0
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
      - 16384
      - 1073758208
      - 1073741824
      - 1073741826
      - 1073741828
      - 1073741832
      - 1073741840
      - 1073741856
      - 1073741952
      - 1073742080
      - 1073742336
      - 1073742848
      - 1073743872
      - 1073745920
      - -2147483648
      - -2147483392
      - -1073741568
      - -2147479552
      - -1073737728
      - -2147483640
      - -1073741816
      type:
      - integer
      - 'null'
      description: "\n\n**0**: **None**  \n\n\n**1**: **PrivateKey**  \nIndicates the stored data is a Private Key\n\n**2**: **Certificate**  \nIndicates the stored data is a Certificate\n\n**4**: **PKCS12**  \nIndicates the stored data is a PKCS12 blob\n\n**8**: **SymmetricKey**  \nIndicates the stored data is a Symmetric Key\n\n**16**: **State**  \nIndicates the stored data is an Assembly State Blob\n\n**32**: **Password**  \nIndicates the stored data is a Password\n\n**64**: **Csr**  \nIndicates the stored data is a Certificate Signing Request\n\n**128**: **Blob**  \nIndicates the stored data is a Generic Blob\n\n**256**: **PKCS8**  \nIndicates the stored data is a DER formated PKCS8 (Private Key)\n\n**512**: **PKCS10**  \nIndicates the stored data is a DER formatted PKCS10 (CSR)\n\n**1024**: **File**  \nIndicates the stored data is a regular file\n\n**2048**: **RSAPublicKey**  \nIndicates the stored data is an RSA public key\n\n**4096**: **PublicKey**  \nIndicates the stored data is a public key\n\n**8192**: **AccessGrant**  \nIndicates the stored data is an access grant\n\n**16384**: **SshCertificate**  \nIndicates the stored data is raw OpenSsh certificate material\n\n**1073758208**: **ArchivedSshCertificate**  \nIndicates the stored data is deleted raw OpenSsh certificate material\n\n**1073741824**: **Archived**  \nOverlay to indicate archived entries\n\n**1073741826**: **ArchivedCertificate**  \nIndicates the stored data is a Certificate\n\n**1073741828**: **ArchivedPKCS12**  \nIndicates the stored data is a PKCS12 blob\n\n**1073741832**: **ArchivedSymmetricKey**  \nIndicates the stored data is a Symmetric Key\n\n**1073741840**: **ArchivedState**  \nIndicates the stored data is an Assembly State Blob\n\n**1073741856**: **ArchivedPassword**  \nIndicates the stored data is a Password\n\n**1073741952**: **ArchivedBlob**  \nIndicates the stored data is a Generic Blob\n\n**1073742080**: **ArchivedPKCS8**  \nIndicates the stored data is a DER formated PKCS8 (Private Key)\n\n**1073742336**: **ArchivedPKCS10**  \nIndicates the stored data is a DER formatted PKCS10 (CSR)\n\n**1073742848**: **ArchivedFile**  \nIndicates the stored data is a regular file\n\n**1073743872**: **ArchivedRSAPublicKey**  \nIndicates the archived data is an RSA public key\n\n**1073745920**: **ArchivedPublicKey**  \nIndicates the stored data is a public key\n\n**-2147483648**: **Refigram**  \nOverlay to indicate Refigram entries.\n\n**-2147483392**: **RefigramPKCS8**  \nIndicates the stored data is a refigram for a private key stored on an HSM\n\n**-1073741568**: **ArchivedRefigramPKCS8**  \nIndicates the stored data is a refigram for a private key stored on an HSM\n\n**-2147479552**: **RefigramPublicKey**  \nIndicates the stored data is a refigram for a public key stored on an HSM\n\n**-1073737728**: **ArchivedRefigramPublicKey**  \nIndicates the stored data is a refigram for a public key stored on an HSM\n\n**-2147483640**: **RefigramSymmetricKey**  \nIndicates the stored data is a refigram for a symmetric key stored on an HSM\n\n**-1073741816**: **ArchivedRefigramSymmetricKey**  \nIndicates the stored data is a refigram for a symmetric key stored on an HSM\n"
      format: int32
