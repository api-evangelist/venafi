        '401':
          description: The user is not authorized to look up the expiring certificates in the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
        '500':
          description: An error occurred on the server while looking up the expiring certificates in the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
      security:
      - AccessToken: []
  /vedsdk/X509CertificateStore/remove:
    post:
      tags:
      - SecretStore APIs
      summary: Remove an X509 certificate
      description: 'This method validates the request and removes a certificate from the certificate store.

        If a vault ID is provided, it removes the certificate associated with that vault ID.

        If a certificate is provided, it looks up the vault ID of the certificate and removes it.

        The method logs the event if the certificate is successfully removed.


        _Required scope: restricted:delete_'
      operationId: Venafi_Core_WebSDK_X509CertificateStoreRest_Remove
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebRequest_remove'
        required: true
      responses:
        '200':
          description: The certificate was successfully removed from the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse_remove'
        '400':
          description: The request was invalid, possibly due to missing required properties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
        '401':
          description: The user is not authorized to remove the certificate from the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
        '500':
          description: An error occurred on the server while removing the certificate from the vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_X509CertificateStoreWebResponse'
      security:
      - AccessToken: []
  /vedsdk/X509CertificateStore/retrieve:
    post:
      tags:
      - SecretStore APIs
      summary: Retrieve an X509 certificate
      description: 'This method validates the request and retrieves a certificate from the certificate store based on the provided vault ID.

        The method also retrieves any associated names and values with the certificate.

        The method logs the event if the certificate is successfully retrieved.


        _Required scope: certificate:manage_'
      operationId: Venafi_Core_WebSDK_X509CertificateStoreRest_Retrieve
