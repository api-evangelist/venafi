          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams_WebSDK_TeamWebResponse'
      security:
      - AccessToken: []
  /vedsdk/teams/renameteam:
    put:
      tags:
      - Teams APIs
      summary: Rename a team
      description: 'Renames a team and updates team assets with new team name


        _Required scope: configuration:manage_'
      operationId: Venafi_Teams_WebSDK_TeamsRest_RenameTeam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Teams_WebSDK_TeamWebRequest_renameteam'
        required: true
      responses:
        '200':
          description: ' The team was renamed successfully.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams_WebSDK_TeamWebResponse'
        '400':
          description: ' The request is invalid or required parameters are missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams_WebSDK_TeamWebResponse'
      security:
      - AccessToken: []
