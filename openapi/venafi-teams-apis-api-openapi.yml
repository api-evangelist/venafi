          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams_WebSDK_TeamWebResponse'
      security:
      - AccessToken: []
  /vedsdk/teams/removeteammembers:
    put:
      tags:
      - Teams APIs
      summary: Remove members from a team
      description: 'Removes members from an existing team.


        _Required scope: configuration:manage_'
