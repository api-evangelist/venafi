openapi: 3.2.0
info:
  title: Trust Protection Foundation WebSDK Teams APIs API
  description: '# Introduction

    The Trust Protection Foundation Web SDK is a subset of REST APIs that allow you to:

    * Automate certificate management

    * Integrate with DevOps processes

    * Discover machine identities

    * Extract data to integrate with data warehouses

    * Perform bulk actions

    * Set up and administer Trust Protection Foundation

    * Onboard teams

    * Create custom, automated business logic and flows between internal systems


    All these use cases can be accomplished using the Trust Protection Foundation REST…'
  version: 26.1.1
servers:
- url: /
  description: Current Host
- url: https://REPLACEdnsnameME/
  description: System
- url: https://{dnsname}/
  description: Configurable Hostname
  variables:
    dnsname:
      default: localhost
      description: Production API Hostname
security:
- AccessToken: []
tags:
- name: Teams APIs
  description: The Teams interface allows you to associate AD, LDAP, and local Identities to Policy assets and CyberArk products.
paths:
  /vedsdk/teams/:
    post:
      tags:
      - Teams APIs
      summary: Create a team
      description: 'Adds a team to an identity provider. Members specified for the team will be added.


        _Required scope: configuration:manage_'
      operationId: Venafi_Teams_WebSDK_TeamsRest_CreateTeam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Teams_WebSDK_TeamWebRequest__'
        required: true
      responses:
        '200':
          description: The team was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams_WebSDK_TeamWebResponse'
        '400':
          description: ' The request is invalid or required parameters are missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams_WebSDK_TeamWebResponse'
      security:
      - AccessToken: []
  /vedsdk/teams/{prefix}/{principal}:
    parameters:
    - name: prefix
      in: path
      description: The identity provider prefix.
      required: true
      schema:
        type: string
    - name: principal
      in: path
      description: The Universally Unique Identifier (UUID) of the user or group identity.
      required: true
      schema:
        type: string
    get:
      tags:
      - Teams APIs
      summary: Get a team
      description: 'Retrieves the details of a specified team, including its members, owners, products, assets, and description.


        _Required scope: configuration:manage_'
      operationId: Venafi_Teams_WebSDK_TeamsRest_GetTeam
      responses:
        '200':
          description: The team details were retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams_WebSDK_TeamWebResponse'
        '400':
          description: The request is invalid or required parameters are missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams_WebSDK_TeamWebResponse'
      security:
      - AccessToken: []
    put:
      tags:
      - Teams APIs
      summary: Update a team
      description: 'This API updates the details of an existing team, including its members, owners, products, assets, and description.


        _Required scope: configuration:manage_'
      operationId: Venafi_Teams_WebSDK_TeamsRest_UpdateTeam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Teams_WebSDK_TeamWebRequest'
        required: true
      responses:
        '200':
          description: The team details were updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams_WebSDK_TeamWebResponse'
        '400':
          description: The request is invalid or required parameters are missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams_WebSDK_TeamWebResponse'
      security:
      - AccessToken: []
    delete:
      tags:
      - Teams APIs
      summary: Delete a team
      description: 'The team was deleted successfully.


        _Required scope: configuration:delete_'
      operationId: Venafi_Teams_WebSDK_TeamsRest_DeleteTeam
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams_WebSDK_TeamWebResponse'
        '400':
          description: The request is invalid or required parameters are missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teams_WebSDK_TeamWebResponse'
      security:
      - AccessToken: []
  /vedsdk/teams/addteammembers:
    put:
      tags:
      - Teams APIs
      summary: Add members to a team
      description: 'Adds members to an existing team.


        _Required scope: configuration:manage_'
