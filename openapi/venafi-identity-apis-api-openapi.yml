  /vedsdk/identity/addgroup:
    post:
      tags:
      - Identity APIs
      summary: Add Group
      description: 'Adds a group to an identity provider. The group or team resides in the local provider.

        However, members, which are Trust Protection Foundation users or groups, can originate

        from a local, AD, or LDAP provider.


        _Required scope: configuration:manage_'
