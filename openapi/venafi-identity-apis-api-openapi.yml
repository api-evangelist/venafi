openapi: 3.2.0
info:
  title: Trust Protection Foundation WebSDK Identity APIs API
  description: '# Introduction

    The Trust Protection Foundation Web SDK is a subset of REST APIs that allow you to:

    * Automate certificate management

    * Integrate with DevOps processes

    * Discover machine identities

    * Extract data to integrate with data warehouses

    * Perform bulk actions

    * Set up and administer Trust Protection Foundation

    * Onboard teams

    * Create custom, automated business logic and flows between internal systems


    All these use cases can be accomplished using the Trust Protection Foundation REST…'
  version: 26.1.1
servers:
- url: /
  description: Current Host
- url: https://REPLACEdnsnameME/
  description: System
- url: https://{dnsname}/
  description: Configurable Hostname
  variables:
    dnsname:
      default: localhost
      description: Production API Hostname
security:
- AccessToken: []
tags:
- name: Identity APIs
  description: The Identity interface manages users and group access.
paths:
  /vedsdk/identity/browse:
    post:
      tags:
      - Identity APIs
      summary: Search Identity Entries
      description: 'Returns information about individual identity, group identity, or distribution groups from a local or non-local

        provider such as Active Directory. This method only searches for identities that are

        contained in the identity provider of the authenticated user.


        For AD or LDAP, use both the Filter and Limit parameters. As a best practice, if you expect one

        result, specify Limit=2 to detect extraneous information. Default, when you omit this parameter:


        |Type|Recommendation|

        |---|---|

        |Active Directory|250 individual identities, group identities, or distribution groups|

        |LDAP|500 individual identities, group identities, or distribution groups|

        |Local|50 individual identities, group identities, or distribution groups|


        _Required scope: configuration_'
      operationId: Venafi_Core_WebSDK_IdentityRest_Browse
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Core_WebSDK_IdentityWebRequest_browse'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core_WebSDK_IdentityWebResponse_browse'
        '403':
          description: ' The API requires a scope not granted to the provided access token '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Web_SDK_Authentication_OAuthError'
        '400':
          description: ' Missing or invalid request property. '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Web_SDK_Authentication_OAuthError'
        '401':
          description: ' A valid access token is required. '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Web_SDK_Authentication_OAuthError'
      security:
      - AccessToken: []
  /vedsdk/identity/getassociatedentries:
    post:
      tags:
      - Identity APIs
      summary: Get Associated Identity Entries
      description: 'Returns all associated identity groups and folders for a given identity entry.


