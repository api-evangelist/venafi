  /vedsdk/identity/removegroupmembers:
    put:
      tags:
      - Identity APIs
      summary: Remove Group Members
      description: 'Removes a member from a group in an identity provider. Even though the user or group is removed from the local group, Trust Protection Platform retains the identities.


