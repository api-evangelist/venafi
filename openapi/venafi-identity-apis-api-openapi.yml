  /vedsdk/identity/SetPassword:
    post:
      tags:
      - Identity APIs
      summary: Change Password
      description: 'Rotates a password for an identity. Password rotation for a group account is not supported. Password rotation

        for any account that is managed by an external identity provider, such as Active Directory (AD) or

        Lightweight Directory Access Protocol (LDAP) is not supported.


        _Required scope: security:manage_'
      operationId: Venafi_Core_WebSDK_IdentityRest_SetIdentityPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Core_WebSDK_IdentityWebRequest_SetPassword'
