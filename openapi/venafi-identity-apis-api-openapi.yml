  /vedsdk/identity/group/{prefix}/{principal}:
    parameters:
    - name: prefix
      in: path
      description: The identity provider prefix
      required: true
      schema:
        type: string
    - name: principal
      in: path
      description: The universal identifier of the identity
      required: true
      schema:
        type: string
    delete:
      tags:
      - Identity APIs
      summary: Delete Group
      description: 'Deletes a group from an identity provider. The local group or team can contain users

        or other groups from local, AD, or LDAP identity providers. During deletion, Trust

        Protection Platform removes the local group and retains the identities.


        _Required scope: configuration:delete_'
      operationId: Venafi_Core_WebSDK_IdentityRest_DeleteGroup
      responses:
        '200':
          description: Success
          content:
