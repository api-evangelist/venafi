components:
  schemas:
    Core_WebSDK_MetadataWebRequest_getitems:
      required:
      - DN
      type: object
      properties:
        DN:
          type: string
          description: The DN of a Certificate or Device object to look up.
    Core_WebSDK_MetadataWebRequest_undefineitem:
      required:
      - ItemGuid
      type: object
      properties:
        ItemGuid:
          type: string
          description: The GUID of the Custom Field to delete.
        RemoveData:
          type: boolean
          description: 'Boolean indicating if existing values should be deleted when the Custom Field is deleted:

            * **true**: Delete existing values stored for the Custom Field before deleting the Custom Field itself.

            * **false**: Default. Do not delete any stored values. If values exist, the delete of the Custom Field will fail.'
    Core_WebSDK_MetadataWebResponse_loaditem:
      type: object
      properties:
        Item:
          type: object
          properties:
            Type:
              $ref: '#/components/schemas/Core_MetadataType'
            Label:
              type: string
              description: Gets or sets the metadata label
            Help:
              type: string
              description: Gets or sets the help text describing the metadata field.
            Category:
              type: string
              description: The category DN, or **null** if none.
            DisplayAfter:
              type: string
              description: The metadata item after which to render this item
            Name:
              type: string
              description: Gets or sets the name of the metadata item.
            Guid:
              type: string
              description: Gets or sets the Guid of the metadata item.
            DN:
              type: string
              description: The DN.
            Mandatory:
              type: boolean
              description: '**true** if mandatory; otherwise, **false**.'
            DefaultValues:
              type: array
              items:
                type: string
              description: Gets or sets the list of default values for this metadata field.
            AllowedValues:
              type: array
              items:
                type: string
              description: Gets or sets the list of allowed values for this metadata field.
            Classes:
              type: array
              items:
                type: string
              description: Gets or sets the list of schema classes this metadata field applies to
            LocalizationSet:
              type: array
              items:
                type: object
                properties:
                  Language:
                    type: string
                    description: ''
                  List:
                    type: array
                    items:
                      type: object
                      properties:
                        Invariant:
                          type: string
                          description: ''
                        Localized:
                          type: string
                          description: ''
                      description: Support class to allow serialization of values for a metadata object
                    description: ''
                description: Support class to allow serialization of values for a metadata object
              description: The localization table.
            MinimumLength:
              type:
              - integer
              - 'null'
              description: Gets or sets the minimum length of the text field.
              format: int32
            MaximumLength:
              type:
              - integer
              - 'null'
              description: Gets or sets the maximum length of the text field.
              format: int32
            Mask:
              type: string
              description: Gets or sets the input mask.
            AllowedCharacters:
              type: string
              description: Gets or sets the allowed characters for the text field.
